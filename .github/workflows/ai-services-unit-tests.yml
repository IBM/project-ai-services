name: AI Services Unit Tests

on:
  pull_request:
    paths:
      - 'ai-services/**'
      - '.github/workflows/ai-services-unit-tests.yml'
    branches:
      - main
      - 'release-*'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'ai-services/go.mod'
          cache-dependency-path: 'ai-services/go.sum'

      - name: Run unit tests with coverage
        working-directory: ai-services
        run: |
          go test \
            -tags "exclude_graphdriver_btrfs containers_image_openpgp remote" \
            -v \
            -coverprofile=coverage.out \
            -covermode=atomic \
            $(go list ./... | grep -v '/tests/e2e')

      - name: Print coverage summary
        working-directory: ai-services
        run: go tool cover -func=coverage.out

