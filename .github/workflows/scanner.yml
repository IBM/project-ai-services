name: Image Scanner

on:
  workflow_call:
    inputs:
      # Path to the directory containing the Makefile used to build/tag the image (e.g. 'images/caddy', 'services').
      path:
        required: false
        type: string
      # Service name passed to the Makefile targets (e.g. 'chatbot', 'digitize'). Only needed when multiple
      # services share the same path (i.e. the 'services' directory).
      service:
        required: false
        type: string
      # When true, skips the image build step and pulls the latest image directly from the registry.
      # When false (default), the image is built locally from source before scanning.
      skip-image-build:
        required: false
        type: boolean
        default: false
      # Name of the image in the registry (e.g. 'caddy', 'chatbot-service'). Used to construct the full
      # image reference when pulling from the registry (skip-image-build: true).
      image:
        required: false
        type: string
      # When true (default), Trivy only reports vulnerabilities that have a known fix available.
      # Set to false to also report unfixed/unpatched CVEs.
      ignore-unfixed:
        required: false
        type: boolean
        default: true
      # When true (default), the scan targets the built container image (CVE + license).
      # When false, the license scan targets the ai-services source code on the filesystem instead,
      # and the CVE scan is skipped entirely.
      is-image-scan:
        required: false
        type: boolean
        default: true
env:
  IMAGE_FILE_NAME: image.tar
  ICR_REGISTRY: icr.io/ai-services-cicd
  TRIVY_SBOM_FILE: trivy.json
  PARLAY_SBOM_FILE: parlay.json
  PARLAY_VERSION: v0.11.0

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04-ppc64le
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build image
        if: ${{ !inputs.skip-image-build }}
        working-directory: ${{ inputs.path }}
        run: |
          make build \
            SERVICE=${{ inputs.service }} \
            REGISTRY=${{ env.ICR_REGISTRY }} \
            REGISTRY_USER=${{ secrets.ICR_USERNAME }} \
            REGISTRY_PASSWORD=${{ secrets.ICR_APIKEY }}

      - name: Pull latest image tag
        if: ${{ inputs.skip-image-build }}
        working-directory: ${{ inputs.path }}
        run: |
          TAG_VALUE=$(make image-tag SERVICE=${{ inputs.service }})
          IMAGE_NAME=${{ env.ICR_REGISTRY }}/${{ inputs.image }}:${TAG_VALUE}
          podman pull --creds ${{ secrets.ICR_USERNAME }}:${{ secrets.ICR_APIKEY }} $IMAGE_NAME

      - name: Save image in file
        if: ${{ inputs.is-image-scan }}
        run: |
          IMAGE_NAME=$(podman images --format "{{.Repository}}:{{.Tag}}" | grep "${{ env.ICR_REGISTRY }}" | head -n 1)
          podman save > ${{ env.IMAGE_FILE_NAME }} $IMAGE_NAME

      # --- License scan ---

      - name: Generate trivy SBOM scan report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: ${{ inputs.is-image-scan && 'image' || 'fs' }}
          input: ${{ inputs.is-image-scan && env.IMAGE_FILE_NAME || './ai-services' }}
          format: cyclonedx
          output: ${{ env.TRIVY_SBOM_FILE }}

      - name: Enrich trivy SBOM with parlay
        run: |
          mkdir -p $HOME/bin
          wget https://github.com/snyk/parlay/releases/download/${{ env.PARLAY_VERSION }}/parlay_Linux_ppc64le.tar.gz
          tar -xzf parlay_Linux_ppc64le.tar.gz
          chmod +x parlay
          mv parlay $HOME/bin
          export PATH=$HOME/bin:$PATH
          parlay --version
          parlay ecosystems enrich ${{ env.TRIVY_SBOM_FILE }} | jq . > ${{ env.PARLAY_SBOM_FILE }}

      - name: Licenses scan
        run: python .github/scripts/license_scan.py ${{ env.TRIVY_SBOM_FILE }} ${{ env.PARLAY_SBOM_FILE }}

      # --- CVE scan ---

      - name: Trivy vulnerability scan
        if: ${{ inputs.is-image-scan }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: ${{ env.IMAGE_FILE_NAME }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: ${{ inputs.ignore-unfixed }}
          skip-dirs: '**/site-packages/docs'
