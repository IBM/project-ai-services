name: Check Image Version Bump

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'services/chatbot/**'
      - 'services/digitize/**'
      - 'services/similarity/**'
      - 'services/summarize/**'
      - 'images/**'
      - 'ui/**'
      - 'ai-services/**'
      - '.github/workflows/bump-image-version.yml'
      - '.github/scripts/check_make_version_tag.py'
      - .github/scripts/check_image_names.py
    branches:
      - main
      - 'release-*'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-version-bump:
    name: Check Makefile Version Bumps
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Check version bumps for all components
        run: |
          python3 .github/scripts/check_makefile_version_bump.py ${{ github.base_ref }}
      
      - name: Run image name consistency check
        run: python3 .github/scripts/check_image_names.py

