name: Go

on:
  pull_request:
    paths:
      - 'ai-services/**'
      - .github/workflows/go.yaml
    branches:
      - main
      - 'release-*'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-checks:
    uses: ./.github/workflows/go-checks.yml
    with:
      working-directory: 'ai-services'
      test-tags: 'exclude_graphdriver_btrfs containers_image_openpgp remote'
      run-swagger-check: true
