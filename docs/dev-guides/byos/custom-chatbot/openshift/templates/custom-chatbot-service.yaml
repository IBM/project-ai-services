apiVersion: v1
kind: Service
metadata:
  name: "custom-chatbot"
  labels:
    ai-services.io/service: {{ .Release.Name }}
    ai-services.io/template: {{ .Values.templateID }}
    ai-services.io/version: {{ default .Chart.AppVersion | quote }}
spec:
  selector:
    ai-services.io/service: {{ .Release.Name }}
    ai-services.io/component: custom-chatbot
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
