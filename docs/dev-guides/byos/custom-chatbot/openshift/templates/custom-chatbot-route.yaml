apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: "custom-chatbot-ui"
  labels:
    ai-services.io/service: {{ .Release.Name }}
    ai-services.io/template: {{ .Values.templateID }}
    ai-services.io/version: {{ default .Chart.AppVersion | quote }}
    ai-services.io/endpoint-type: ui
  annotations:
    haproxy.router.openshift.io/set-forwarded-for: "true"
    haproxy.router.openshift.io/rewrite-target: "http-response set-header X-Accel-Buffering no"
spec:
  port:
    targetPort: 8080
  to:
    kind: Service
    name: "custom-chatbot"
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: "custom-chatbot-api"
  labels:
    ai-services.io/service: {{ .Release.Name }}
    ai-services.io/template: {{ .Values.templateID }}
    ai-services.io/version: {{ default .Chart.AppVersion | quote }}
    ai-services.io/endpoint-type: api
spec:
  port:
    targetPort: 8080
  to:
    kind: Service
    name: "custom-chatbot"
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
