<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 680" width="860" height="680" font-family="-apple-system, Segoe UI, system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="c-arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3b82d4"/></marker>
    <marker id="c-arrg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2d9a5f"/></marker>
    <marker id="c-arrr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#c0392b"/></marker>
    <marker id="c-arrm" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7c5cd8"/></marker>
  </defs>

  <!-- ═══════════════════════════════════════════════
       TOP SECTION — Process / thread model
       ═══════════════════════════════════════════════ -->

  <!-- OS Process outer box -->
  <rect x="10" y="10" width="840" height="220" rx="6" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="26" y="30" font-size="11" font-weight="600" fill="#57606a">OS Process (uvicorn)</text>

  <!-- Main thread -->
  <rect x="26" y="40" width="340" height="54" rx="4" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/>
  <text x="196" y="58" text-anchor="middle" font-weight="700" fill="#1e40af">Main thread  (asyncio event loop)</text>
  <text x="196" y="74" text-anchor="middle" font-size="11" fill="#1e40af">handles HTTP · runs lifespan hooks · calls start_worker() on POST</text>
  <text x="196" y="88" text-anchor="middle" font-size="11" fill="#1e40af">PUT updates DB only — thread re-reads config before next tick</text>

  <!-- Daemon threads -->
  <rect x="380" y="40" width="140" height="54" rx="4" fill="#dcfce7" stroke="#2d9a5f" stroke-width="1.5"/>
  <text x="450" y="62" text-anchor="middle" font-weight="700" fill="#166534">daemon thread</text>
  <text x="450" y="78" text-anchor="middle" font-size="11" fill="#166534">connector A</text>

  <rect x="530" y="40" width="140" height="54" rx="4" fill="#dcfce7" stroke="#2d9a5f" stroke-width="1.5"/>
  <text x="600" y="62" text-anchor="middle" font-weight="700" fill="#166534">daemon thread</text>
  <text x="600" y="78" text-anchor="middle" font-size="11" fill="#166534">connector B</text>

  <rect x="680" y="40" width="140" height="54" rx="4" fill="#dcfce7" stroke="#2d9a5f" stroke-width="1.5"/>
  <text x="750" y="62" text-anchor="middle" font-weight="700" fill="#166534">daemon thread</text>
  <text x="750" y="78" text-anchor="middle" font-size="11" fill="#166534">connector C</text>

  <!-- Manager label -->
  <rect x="26" y="110" width="810" height="46" rx="4" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="431" y="129" text-anchor="middle" font-weight="700" fill="#1f2328">ConnectorWorkerManager  (module-level singleton)</text>
  <text x="431" y="148" text-anchor="middle" font-size="11" fill="#57606a">_workers = { connector_id: (thread, worker, stop_event), … }</text>

  <!-- Monitor thread -->
  <rect x="26" y="168" width="810" height="46" rx="4" fill="#ede9fe" stroke="#7c5cd8" stroke-width="1"/>
  <text x="431" y="187" text-anchor="middle" font-weight="700" fill="#4c1d95">connector-monitor thread  (daemon, one global)</text>
  <text x="431" y="206" text-anchor="middle" font-size="11" fill="#4c1d95">polls _workers every 30 s · detects crashes · schedules respawn with back-off</text>

  <!-- ═══════════════════════════════════════════════
       BOTTOM SECTION — Thread lifecycle state machine
       ═══════════════════════════════════════════════ -->

  <!-- Legend -->
  <rect x="10" y="248" width="148" height="92" rx="4" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="20" y="266" font-weight="600" fill="#1f2328">Legend</text>
  <line x1="20" y1="280" x2="52" y2="280" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#c-arr)"/>
  <text x="58" y="284" fill="#1f2328">API-triggered</text>
  <line x1="20" y1="296" x2="52" y2="296" stroke="#2d9a5f" stroke-width="1.5" marker-end="url(#c-arrg)"/>
  <text x="58" y="300" fill="#1f2328">Normal loop</text>
  <line x1="20" y1="312" x2="52" y2="312" stroke="#c0392b" stroke-width="1.5" marker-end="url(#c-arrr)"/>
  <text x="58" y="316" fill="#1f2328">Error / stop</text>
  <line x1="20" y1="328" x2="52" y2="328" stroke="#7c5cd8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#c-arrm)"/>
  <text x="58" y="332" fill="#1f2328">Recovery</text>

  <!-- ── States (centered column) ── -->

  <!-- Created -->
  <rect x="320" y="248" width="180" height="36" rx="4" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/>
  <text x="410" y="270" text-anchor="middle" font-weight="700" fill="#1e40af">Created</text>

  <!-- Running -->
  <rect x="320" y="322" width="180" height="36" rx="4" fill="#dcfce7" stroke="#2d9a5f" stroke-width="1.5"/>
  <text x="410" y="344" text-anchor="middle" font-weight="700" fill="#166534">Running</text>

  <!-- Fetch connector details from DB -->
  <rect x="270" y="396" width="280" height="36" rx="4" fill="#dcfce7" stroke="#2d9a5f" stroke-width="1.5"/>
  <text x="410" y="418" text-anchor="middle" font-weight="700" fill="#166534">Fetch connector details from DB</text>

  <!-- Ticking -->
  <rect x="320" y="470" width="180" height="36" rx="4" fill="#dcfce7" stroke="#2d9a5f" stroke-width="1.5"/>
  <text x="410" y="492" text-anchor="middle" font-weight="700" fill="#166534">Ticking</text>

  <!-- Sleeping -->
  <rect x="580" y="470" width="150" height="36" rx="4" fill="#f7f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="655" y="492" text-anchor="middle" font-weight="700" fill="#57606a">Sleeping</text>

  <!-- Stopped -->
  <rect x="100" y="580" width="150" height="36" rx="4" fill="#f7f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="175" y="602" text-anchor="middle" font-weight="700" fill="#57606a">Stopped</text>

  <!-- Crashed -->
  <rect x="580" y="580" width="150" height="36" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
  <text x="655" y="602" text-anchor="middle" font-weight="700" fill="#991b1b">Crashed</text>

  <!-- ── Arrows ── -->

  <!-- Created → Running -->
  <line x1="410" y1="284" x2="410" y2="320" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#c-arr)"/>
  <text x="418" y="308" font-size="11" fill="#57606a">thread.start()</text>

  <!-- Running → Fetch -->
  <line x1="410" y1="358" x2="410" y2="394" stroke="#2d9a5f" stroke-width="1.5" marker-end="url(#c-arrg)"/>
  <text x="418" y="382" font-size="11" fill="#57606a">get_active_connector()</text>

  <!-- Fetch → Ticking -->
  <line x1="410" y1="432" x2="410" y2="468" stroke="#2d9a5f" stroke-width="1.5" marker-end="url(#c-arrg)"/>
  <text x="418" y="456" font-size="11" fill="#57606a">first tick (immediate)</text>

  <!-- Ticking → Sleeping -->
  <line x1="500" y1="488" x2="578" y2="488" stroke="#2d9a5f" stroke-width="1.5" marker-end="url(#c-arrg)"/>
  <text x="502" y="482" font-size="11" fill="#57606a">tick done</text>

  <!-- Sleeping → Fetch (loop) -->
  <path d="M655,470 C655,438 410,438 410,394" fill="none" stroke="#2d9a5f" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#c-arrg)"/>
  <text x="540" y="435" font-size="11" fill="#57606a">interval elapsed</text>

  <!-- DELETE → Stopped (left rail) -->
  <line x1="320" y1="340" x2="230" y2="340" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="230" y1="340" x2="230" y2="596" stroke="#c0392b" stroke-width="1.5" marker-end="url(#c-arrr)"/>
  <text x="202" y="462" font-size="11" fill="#c0392b" transform="rotate(-90,202,462)">DELETE · stop_event.set()</text>

  <!-- Stopped label detail -->
  <text x="100" y="632" font-size="11" fill="#57606a">tick finishes / sleep wakes</text>
  <text x="100" y="645" font-size="11" fill="#57606a">thread exits cleanly</text>

  <!-- Unhandled exception → Crashed (right rail) -->
  <line x1="500" y1="488" x2="655" y2="488" stroke="none"/>
  <!-- crash path from Ticking right rail -->
  <line x1="500" y1="488" x2="580" y2="488" stroke="none"/>
  <line x1="720" y1="470" x2="720" y2="578" stroke="#c0392b" stroke-width="1.5" marker-end="url(#c-arrr)"/>
  <line x1="500" y1="488" x2="720" y2="488" stroke="#c0392b" stroke-width="1.5"/>
  <text x="524" y="508" font-size="11" fill="#c0392b">unhandled exception</text>
  <text x="524" y="521" font-size="11" fill="#c0392b">status written to DB</text>

  <!-- Crashed → Recovered → Created (recovery loop) -->
  <path d="M580,598 C540,598 540,650 430,650 C320,650 290,620 290,602 C290,560 320,542 320,488 C320,438 340,438 410,438" fill="none" stroke="#7c5cd8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#c-arrm)"/>
  <text x="282" y="666" font-size="11" fill="#7c5cd8">monitor respawns with back-off · new thread re-enters lifecycle</text>

  <!-- FastAPI startup note -->
  <rect x="580" y="310" width="256" height="36" rx="4" fill="#ede9fe" stroke="#7c5cd8" stroke-width="1"/>
  <text x="708" y="325" text-anchor="middle" font-size="11" font-weight="600" fill="#4c1d95">FastAPI startup</text>
  <text x="708" y="341" text-anchor="middle" font-size="11" fill="#4c1d95">load active_connectors · recreate workers</text>
  <line x1="580" y1="328" x2="502" y2="328" stroke="#7c5cd8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#c-arrm)"/>
</svg>
