<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" width="900" height="1000" font-family="-apple-system, Segoe UI, system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="del-arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#c0392b"/></marker>
    <marker id="del-arrg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2d9a5f"/></marker>
    <marker id="del-arry" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#ca8a04"/></marker>
  </defs>

  <!-- Title -->
  <rect x="100" y="10" width="700" height="36" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="2"/>
  <text x="450" y="32" text-anchor="middle" font-weight="700" font-size="14" fill="#991b1b">DELETE /v1/connectors/{id} — Comprehensive Flow</text>
  <line x1="450" y1="46" x2="450" y2="66" stroke="#c0392b" stroke-width="2" marker-end="url(#del-arr)"/>

  <!-- HTTP HANDLER — FAST PATH (synchronous, returns immediately) -->
  <rect x="80" y="66" width="740" height="22" rx="4" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="450" y="81" text-anchor="middle" font-weight="700" fill="#854d0e">HTTP Handler (fast synchronous path — returns immediately)</text>

  <line x1="450" y1="88" x2="450" y2="108" stroke="#c0392b" stroke-width="1.5" marker-end="url(#del-arr)"/>

  <!-- Step 1: Check existence -->
  <rect x="100" y="108" width="700" height="48" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1"/>
  <text x="450" y="124" text-anchor="middle" font-weight="600" fill="#991b1b">Step 1 — Check existence</text>
  <text x="450" y="140" text-anchor="middle" fill="#57606a" font-size="11">SELECT * FROM connectors WHERE id = :connector_id</text>
  <text x="450" y="152" text-anchor="middle" fill="#57606a" font-size="11">→ None → return 404 Not Found (exit)</text>

  <line x1="450" y1="156" x2="450" y2="176" stroke="#c0392b" stroke-width="1.5" marker-end="url(#del-arr)"/>

  <!-- Step 2: Mark delete_pending (DB write) -->
  <rect x="100" y="176" width="700" height="60" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1"/>
  <text x="450" y="192" text-anchor="middle" font-weight="600" fill="#991b1b">Step 2 — Mark delete_pending (COMMITTED before 204)</text>
  <text x="450" y="208" text-anchor="middle" fill="#57606a" font-size="11">UPDATE connectors SET sync_status = 'delete_pending' WHERE id = :connector_id</text>
  <text x="450" y="224" text-anchor="middle" fill="#57606a" font-size="11">→ DB commit (readers now see 'delete_pending')</text>

  <line x1="450" y1="236" x2="450" y2="256" stroke="#c0392b" stroke-width="1.5" marker-end="url(#del-arr)"/>

  <!-- Step 3: Signal deletion (in-process) -->
  <rect x="100" y="256" width="700" height="60" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1"/>
  <text x="450" y="272" text-anchor="middle" font-weight="600" fill="#991b1b">Step 3 — Signal deletion (in-process, not DB)</text>
  <text x="450" y="288" text-anchor="middle" fill="#57606a" font-size="11">_pending_deletions.add(connector_id)</text>
  <text x="450" y="304" text-anchor="middle" fill="#57606a" font-size="11">→ Live tick polls this set at each phase boundary</text>

  <line x1="450" y1="316" x2="450" y2="336" stroke="#c0392b" stroke-width="1.5" marker-end="url(#del-arr)"/>

  <!-- Step 4: Dispatch background teardown -->
  <rect x="100" y="336" width="700" height="60" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1"/>
  <text x="450" y="352" text-anchor="middle" font-weight="600" fill="#991b1b">Step 4 — Dispatch background teardown</text>
  <text x="450" y="368" text-anchor="middle" fill="#57606a" font-size="11">asyncio.create_task(_run_teardown(connector_id))</text>
  <text x="450" y="384" text-anchor="middle" fill="#57606a" font-size="11">→ All remaining cleanup runs asynchronously</text>

  <line x1="450" y1="396" x2="450" y2="416" stroke="#c0392b" stroke-width="1.5" marker-end="url(#del-arr)"/>

  <!-- Step 5: Return 204 -->
  <rect x="100" y="416" width="700" height="48" rx="4" fill="#dcfce7" stroke="#2d9a5f" stroke-width="2"/>
  <text x="450" y="432" text-anchor="middle" font-weight="700" fill="#166534">Step 5 — Return 204 No Content immediately</text>
  <text x="450" y="448" text-anchor="middle" fill="#57606a" font-size="11">Response sent; _run_teardown continues in background</text>

  <line x1="450" y1="464" x2="450" y2="484" stroke="#ca8a04" stroke-width="2" marker-end="url(#del-arry)"/>

  <!-- BACKGROUND TEARDOWN — RUNS AFTER 204 IS SENT -->
  <rect x="80" y="484" width="740" height="22" rx="4" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="450" y="499" text-anchor="middle" font-weight="700" fill="#854d0e">_run_teardown (background asyncio.Task — runs AFTER 204)</text>

  <line x1="450" y1="506" x2="450" y2="526" stroke="#ca8a04" stroke-width="1.5" marker-end="url(#del-arry)"/>

  <!-- Step A: Await live tick exit -->
  <rect x="100" y="526" width="700" height="84" rx="4" fill="#fef3c7" stroke="#ca8a04" stroke-width="1"/>
  <text x="450" y="542" text-anchor="middle" font-weight="600" fill="#854d0e">Step A — Await live tick exit (if one exists)</text>
  <text x="450" y="560" text-anchor="middle" fill="#57606a" font-size="11">task = _live_tasks.get(connector_id)</text>
  <text x="450" y="576" text-anchor="middle" fill="#57606a" font-size="11">if task exists: await task with 30 s safety-net timeout</text>
  <text x="450" y="592" text-anchor="middle" fill="#57606a" font-size="11">Tick sees _pending_deletions flag → raises CancelledError → exits cooperatively</text>

  <line x1="450" y1="610" x2="450" y2="630" stroke="#ca8a04" stroke-width="1.5" marker-end="url(#del-arry)"/>

  <!-- Step B: Remove APScheduler job -->
  <rect x="100" y="630" width="700" height="60" rx="4" fill="#fef3c7" stroke="#ca8a04" stroke-width="1"/>
  <text x="450" y="646" text-anchor="middle" font-weight="600" fill="#854d0e">Step B — Remove APScheduler job (AFTER tick exits)</text>
  <text x="450" y="662" text-anchor="middle" fill="#57606a" font-size="11">scheduler.remove_job(connector_id)</text>
  <text x="450" y="678" text-anchor="middle" fill="#57606a" font-size="11">→ No new tick can start during teardown</text>

  <line x1="450" y1="690" x2="450" y2="710" stroke="#ca8a04" stroke-width="1.5" marker-end="url(#del-arry)"/>

  <!-- Step C & D: Snapshot and remove ownership -->
  <rect x="100" y="710" width="700" height="84" rx="4" fill="#fef3c7" stroke="#ca8a04" stroke-width="1"/>
  <text x="450" y="726" text-anchor="middle" font-weight="600" fill="#854d0e">Step C — Snapshot owned checksums</text>
  <text x="450" y="742" text-anchor="middle" fill="#57606a" font-size="11">SELECT checksum, doc_id FROM connector_document_checksum WHERE connector_id = :id</text>
  <text x="450" y="762" text-anchor="middle" font-weight="600" fill="#854d0e">Step D — Remove ownership row by row</text>
  <text x="450" y="778" text-anchor="middle" fill="#57606a" font-size="11">For each: DELETE FROM connector_document_checksum → if remaining == 0: DELETE /v1/documents/{doc_id}</text>

  <line x1="450" y1="794" x2="450" y2="814" stroke="#ca8a04" stroke-width="1.5" marker-end="url(#del-arry)"/>

  <!-- Step E: Delete connector row -->
  <rect x="100" y="814" width="700" height="60" rx="4" fill="#fef3c7" stroke="#ca8a04" stroke-width="1"/>
  <text x="450" y="830" text-anchor="middle" font-weight="600" fill="#854d0e">Step E — Delete connector row</text>
  <text x="450" y="846" text-anchor="middle" fill="#57606a" font-size="11">DELETE FROM connectors WHERE id = :connector_id</text>
  <text x="450" y="862" text-anchor="middle" fill="#57606a" font-size="11">→ Cascade auto-deletes connector_sync_logs rows</text>

  <line x1="450" y1="874" x2="450" y2="894" stroke="#ca8a04" stroke-width="1.5" marker-end="url(#del-arry)"/>

  <!-- Step F: Cleanup staging dirs -->
  <rect x="100" y="894" width="700" height="60" rx="4" fill="#fef3c7" stroke="#ca8a04" stroke-width="1"/>
  <text x="450" y="910" text-anchor="middle" font-weight="600" fill="#854d0e">Step F — Cleanup staging directories</text>
  <text x="450" y="926" text-anchor="middle" fill="#57606a" font-size="11">_pending_deletions.discard(connector_id)</text>
  <text x="450" y="942" text-anchor="middle" fill="#57606a" font-size="11">glob staging/connectors/{connector_id}-* → rm -rf</text>

  <!-- Final invariant -->
  <rect x="100" y="970" width="700" height="18" rx="4" fill="#f0fdf4" stroke="#2d9a5f" stroke-width="1"/>
  <text x="450" y="981" text-anchor="middle" font-size="11" fill="#166534" font-weight="600">INVARIANT: No connector_document_checksum rows remain, APScheduler job gone, DB row deleted</text>
</svg>
