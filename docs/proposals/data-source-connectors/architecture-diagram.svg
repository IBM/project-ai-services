<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 580" width="660" height="580" font-family="-apple-system, Segoe UI, system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="a-arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3b82d4"/></marker>
    <marker id="a-arrg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2d9a5f"/></marker>
  </defs>

  <!-- Catalog box -->
  <rect x="250" y="10" width="160" height="36" rx="4" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="330" y="33" text-anchor="middle" font-weight="600" fill="#1f2328">Catalog</text>

  <!-- Arrow down from Catalog to digitize box -->
  <line x1="330" y1="46" x2="330" y2="82" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#a-arr)"/>
  <text x="338" y="68" font-size="11" fill="#57606a">POST / PUT / DELETE / GET</text>

  <!-- digitize outer box -->
  <rect x="20" y="82" width="620" height="480" rx="6" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="40" y="102" font-weight="700" font-size="13" fill="#1f2328">digitize</text>

  <!-- ── Connector API sub-box ── -->
  <rect x="40" y="114" width="580" height="110" rx="4" fill="#dbeafe" stroke="#3b82d4" stroke-width="1"/>
  <text x="56" y="132" font-weight="600" fill="#1e40af">Connector API  (FastAPI router)</text>

  <!-- POST /v1/connectors -->
  <rect x="56" y="142" width="172" height="26" rx="3" fill="white" stroke="#3b82d4" stroke-width="1"/>
  <text x="142" y="159" text-anchor="middle" font-size="11" fill="#1e40af">POST /v1/connectors</text>

  <!-- POST /v1/connectors/{id}/sync -->
  <rect x="238" y="142" width="198" height="26" rx="3" fill="white" stroke="#3b82d4" stroke-width="1"/>
  <text x="337" y="159" text-anchor="middle" font-size="11" fill="#1e40af">POST /v1/connectors/{id}/sync</text>

  <!-- DELETE /v1/connectors/{id} -->
  <rect x="446" y="142" width="158" height="26" rx="3" fill="white" stroke="#3b82d4" stroke-width="1"/>
  <text x="525" y="159" text-anchor="middle" font-size="11" fill="#1e40af">DELETE /v1/connectors/{id}</text>

  <text x="56" y="194" fill="#1f2328" font-size="11">▸  validates payload · encrypts secret fields before DB write</text>
  <text x="56" y="210" fill="#1f2328" font-size="11">▸  delegates job lifecycle to ConnectorScheduler · POST /sync uses DB atomic guard before dispatch</text>

  <!-- Arrow from Connector API down to ConnectorScheduler -->
  <line x1="330" y1="224" x2="330" y2="248" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#a-arr)"/>

  <!-- ── ConnectorScheduler sub-box ── -->
  <rect x="40" y="248" width="580" height="130" rx="4" fill="#dcfce7" stroke="#2d9a5f" stroke-width="1"/>
  <text x="56" y="268" font-weight="600" fill="#166534">ConnectorScheduler  (APScheduler AsyncScheduler singleton)</text>
  <text x="72" y="288" fill="#1f2328" font-size="11">▸  one IntervalTrigger job per active connector · max_instances=1 prevents overlapping ticks</text>
  <text x="72" y="304" fill="#1f2328" font-size="11">▸  register_connector_job() on POST · remove_connector_job() on DELETE · trigger_now() on POST /sync</text>
  <text x="72" y="320" fill="#1f2328" font-size="11">▸  lifespan recovery: re-registers all persisted connector jobs on startup</text>

  <!-- _run_tick inner box -->
  <rect x="72" y="334" width="516" height="36" rx="4" fill="#bbf7d0" stroke="#2d9a5f" stroke-width="1"/>
  <text x="330" y="349" text-anchor="middle" font-weight="600" fill="#166534">_run_tick(connector_id)  — async coroutine dispatched by scheduler or POST /sync</text>
  <text x="330" y="363" text-anchor="middle" font-size="11" fill="#1f2328">scan remote · classify (skip / cross-dup / ingest) · stage + ingest new files · delete orphans · finalise tick</text>

  <!-- Arrow from ConnectorScheduler down to Persistence -->
  <line x1="330" y1="378" x2="330" y2="402" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#a-arr)"/>

  <!-- ── Persistence sub-box ── -->
  <rect x="40" y="402" width="580" height="142" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
  <text x="56" y="420" font-weight="600" fill="#854d0e">Persistence</text>

  <!-- Row 1 -->
  <rect x="72" y="432" width="246" height="26" rx="3" fill="#fef3c7" stroke="#ca8a04" stroke-width="1"/>
  <text x="195" y="450" text-anchor="middle" fill="#854d0e">connectors</text>
  <rect x="332" y="432" width="256" height="26" rx="3" fill="#fef3c7" stroke="#ca8a04" stroke-width="1"/>
  <text x="460" y="450" text-anchor="middle" fill="#854d0e">connector_document_checksum</text>

  <!-- Row 2 -->
  <rect x="72" y="466" width="246" height="26" rx="3" fill="#fef3c7" stroke="#ca8a04" stroke-width="1"/>
  <text x="195" y="484" text-anchor="middle" fill="#854d0e">connector_sync_logs</text>
  <rect x="332" y="466" width="256" height="26" rx="3" fill="#fef3c7" stroke="#ca8a04" stroke-width="1"/>
  <text x="460" y="484" text-anchor="middle" fill="#854d0e">document_checksum</text>

  <!-- Row 3: asyncio.Lock note -->
  <rect x="72" y="500" width="516" height="26" rx="3" fill="#fef3c7" stroke="#ca8a04" stroke-width="1"/>
  <text x="330" y="518" text-anchor="middle" fill="#854d0e">asyncio.Lock  (_ingest_lock)  — held Phase 2 → end of Phase 4a across all concurrent ticks</text>
</svg>
