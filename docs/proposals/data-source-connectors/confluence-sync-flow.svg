<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 800" width="820" height="800" font-family="-apple-system, Segoe UI, system-ui, sans-serif" font-size="11">
  <defs>
    <marker id="sf-arr"  markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3b82d4"/></marker>
    <marker id="sf-arrg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2d9a5f"/></marker>
    <marker id="sf-arry" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#d97706"/></marker>
    <marker id="sf-arrr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="800" fill="#ffffff"/>

  <!-- Step 1: Start Tick -->
  <rect x="60" y="15" width="700" height="42" rx="4" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.2"/>
  <text x="75" y="33" font-weight="700" fill="#1e40af">1. Trigger Sync Tick &amp; Initialize Log</text>
  <text x="75" y="47" font-size="10" fill="#57606a">try_acquire_sync_lock(connector_id) &#x2192; init_sync_log_and_update_connector(connector_id) [status='syncing']</text>

  <line x1="410" y1="57" x2="410" y2="77" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sf-arr)"/>

  <!-- Step 2: Scan & Checksum -->
  <rect x="60" y="77" width="700" height="65" rx="4" fill="#eff6ff" stroke="#3b82d4" stroke-width="1.2"/>
  <text x="75" y="96" font-weight="700" fill="#1e40af">2. Scan Spaces via Confluence REST API &amp; Compute MD5</text>
  <text x="75" y="112" font-size="10" fill="#1f2328">&#x25B8; ConfluenceScanner executes CQL queries across configured space_keys</text>
  <text x="75" y="126" font-size="10" fill="#1d4ed8" font-weight="600">&#x25B8; Pages: MD5(ConnectorID + PageID + Version) &#x2192; {SpaceKey}-{PageTitle}-{PageID}.html</text>
  <text x="75" y="137" font-size="10" fill="#1d4ed8" font-weight="600">&#x25B8; Attachments: MD5(ConnectorID + AttachmentID + AttachmentVersion) &#x2192; {PageID}-{AttachmentName}</text>

  <line x1="410" y1="142" x2="410" y2="162" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sf-arr)"/>

  <!-- Step 3: Classify -->
  <rect x="60" y="162" width="700" height="80" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="75" y="181" font-weight="700" fill="#92400e">3. Deduplication &amp; Classification (_classify)</text>
  <text x="75" y="198" font-size="10" fill="#1f2328">Compare scanned checksums against known_checksums and global checksum registry:</text>
  <text x="85" y="213" font-size="10" fill="#1f2328">&#x2022; <tspan font-weight="600">Unchanged (in known):</tspan> Skip &#x2022; <tspan font-weight="600">Cross-connector duplicate:</tspan> not expected (checksums are ConnectorID-scoped)</text>
  <text x="85" y="228" font-size="10" fill="#1f2328">&#x2022; <tspan font-weight="600">Brand-new / Modified:</tspan> Add to ingest_list &#x2022; <tspan font-weight="600">Orphans (deleted on Confluence):</tspan> Flag for unlinking</text>

  <line x1="410" y1="242" x2="410" y2="262" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sf-arr)"/>

  <!-- Step 4: Batch Staging & Transformation — taller to fit embed note -->
  <rect x="60" y="262" width="700" height="190" rx="4" fill="#f0fdf4" stroke="#2d9a5f" stroke-width="1.2"/>
  <text x="75" y="281" font-weight="700" fill="#166534">4. Batch Staging &amp; Transformation (_process_new_files in Batches of &#x2264; 10)</text>

  <!-- 4a box — taller -->
  <rect x="75" y="292" width="210" height="112" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="85" y="309" font-weight="600" fill="#14532d">4a. Download &amp; Convert</text>
  <text x="85" y="324" font-size="10" fill="#57606a">Page: export_view &#x2192; .html (no conversion)</text>
  <text x="85" y="337" font-size="10" fill="#57606a">Attachments: .pdf/.docx (explicit + inline-embedded)</text>
  <!-- embed strip note -->
  <rect x="85" y="345" width="190" height="50" rx="2" fill="#fef9c3" stroke="#fde047" stroke-width="0.8"/>
  <text x="93" y="358" font-size="9.5" font-weight="600" fill="#713f12">Embed strip (§7.2):</text>
  <text x="93" y="371" font-size="9.5" fill="#713f12">Parse body.storage for include macros;</text>
  <text x="93" y="383" font-size="9.5" fill="#713f12">strip expanded block from export_view;</text>
  <text x="93" y="394" font-size="9.5" fill="#713f12">insert &lt;!-- embedded page: {filename} --&gt;</text>

  <rect x="305" y="292" width="210" height="112" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="315" y="309" font-weight="600" fill="#14532d">4b. Validate Document</text>
  <text x="315" y="324" font-size="10" fill="#57606a">.pdf/.docx magic bytes; .html UTF-8</text>
  <text x="315" y="337" font-size="10" fill="#57606a">Skip corrupt files cleanly</text>
  <text x="315" y="350" font-size="9.5" font-weight="600" fill="#b45309">verify_integrity() bypassed</text>
  <text x="315" y="362" font-size="9.5" fill="#b45309">(ID-based checksum, no content hash)</text>
  <text x="315" y="378" font-size="9.5" fill="#57606a">Included pages (Page B) validated</text>
  <text x="315" y="390" font-size="9.5" fill="#57606a">independently, own checksum</text>

  <rect x="535" y="292" width="210" height="112" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="545" y="309" font-weight="600" fill="#14532d">4c. Initialize Pipeline</text>
  <text x="545" y="324" font-size="10" fill="#57606a">initialize_and_launch()</text>
  <text x="545" y="337" font-size="10" fill="#57606a">routes by ext: pdf/docx/html</text>
  <text x="545" y="356" font-size="9.5" fill="#57606a">Page A and Page B are each</text>
  <text x="545" y="369" font-size="9.5" fill="#57606a">dispatched as independent files;</text>
  <text x="545" y="382" font-size="9.5" fill="#57606a">chunks attributed to their own filename</text>

  <text x="75" y="422" font-size="10" fill="#14532d">&#x25B8; Polls _wait_for_job() until terminal state (completed / failed / cancelled)</text>
  <text x="75" y="437" font-size="10" fill="#14532d">&#x25B8; Real-time progress updates increment_completed_files() sent after each batch</text>

  <line x1="410" y1="452" x2="410" y2="472" stroke="#2d9a5f" stroke-width="1.5" marker-end="url(#sf-arrg)"/>

  <!-- Step 5: Checksum Registration -->
  <rect x="60" y="472" width="700" height="60" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <text x="75" y="491" font-weight="700" fill="#334155">5. Register Connector Checksums &amp; Cleanup Staging</text>
  <text x="75" y="508" font-size="10" fill="#1f2328">&#x25B8; Map resulting doc_ids to MD5 checksums via add_connector_checksum_entry(connector_id, checksum, doc_id)</text>
  <text x="75" y="522" font-size="10" fill="#1f2328">&#x25B8; Immediate cleanup of local batch directory: cleanup_staging_directory()</text>

  <line x1="410" y1="532" x2="410" y2="552" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sf-arr)"/>

  <!-- Step 6: Orphan Deletion -->
  <rect x="60" y="552" width="700" height="50" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2"/>
  <text x="75" y="571" font-weight="700" fill="#991b1b">6. Delete Orphans (Deleted / Moved Confluence Pages)</text>
  <text x="75" y="588" font-size="10" fill="#7f1d1d">&#x25B8; Remove stale rows from connector_document_checksum; delete vector chunks if remaining owner count == 0</text>

  <line x1="410" y1="602" x2="410" y2="622" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sf-arr)"/>

  <!-- Step 7: Finalize -->
  <rect x="60" y="622" width="700" height="42" rx="4" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.2"/>
  <text x="75" y="640" font-weight="700" fill="#1e40af">7. Finalize Tick &amp; Unlock Connector</text>
  <text x="75" y="654" font-size="10" fill="#57606a">finalize_sync_log_and_update_connector(COMPLETED / OUT_OF_SYNC) &#x2192; Release lock &#x2192; Ready for next tick</text>

  <!-- Interrupt Box Note at Bottom -->
  <rect x="60" y="680" width="700" height="50" rx="4" fill="#fff7ed" stroke="#f97316" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="75" y="698" font-weight="700" fill="#c2410c">&#x26A0; Asynchronous Interrupt Checkpoints</text>
  <text x="75" y="714" font-size="10" fill="#9a3412">_check_interrupt_call() checks for DELETE_PENDING or CANCEL_PENDING between batches and during job wait.</text>
</svg>
