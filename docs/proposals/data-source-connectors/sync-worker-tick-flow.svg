<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 860" width="640" height="860" font-family="-apple-system, Segoe UI, system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="sw-arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3b82d4"/></marker>
    <marker id="sw-arrg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2d9a5f"/></marker>
    <marker id="sw-arrr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#c0392b"/></marker>
    <marker id="sw-arro" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#ca8a04"/></marker>
    <marker id="sw-arrm" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7c5cd8"/></marker>
  </defs>

  <!-- tick guard diamond -->
  <polygon points="300,14 396,52 300,90 204,52" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="300" y="48" text-anchor="middle" font-weight="600" fill="#854d0e">tick already</text>
  <text x="300" y="63" text-anchor="middle" font-weight="600" fill="#854d0e">running?</text>

  <!-- YES → skip -->
  <line x1="396" y1="52" x2="510" y2="52" stroke="#c0392b" stroke-width="1.5" marker-end="url(#sw-arrr)"/>
  <rect x="510" y="35" width="90" height="34" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1"/>
  <text x="555" y="56" text-anchor="middle" font-weight="600" fill="#991b1b">Skip tick</text>
  <text x="404" y="46" font-size="11" fill="#c0392b">YES</text>

  <!-- NO → down -->
  <line x1="300" y1="90" x2="300" y2="114" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sw-arr)"/>
  <text x="308" y="108" font-size="11" fill="#57606a">NO</text>

  <!-- ① insert sync_history + set syncing -->
  <rect x="80" y="114" width="440" height="36" rx="4" fill="#dbeafe" stroke="#3b82d4" stroke-width="1"/>
  <text x="300" y="127" text-anchor="middle" fill="#1e40af" font-weight="600">① Phase 1 — open tick</text>
  <text x="300" y="142" text-anchor="middle" fill="#57606a">INSERT connector_sync_history  ·  UPDATE connectors (sync_status='syncing')</text>
  <line x1="300" y1="150" x2="300" y2="170" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sw-arr)"/>

  <!-- ② load known state -->
  <rect x="80" y="170" width="440" height="48" rx="4" fill="#dbeafe" stroke="#3b82d4" stroke-width="1"/>
  <text x="300" y="185" text-anchor="middle" fill="#1e40af" font-weight="600">② Phase 2 — load known state</text>
  <text x="300" y="200" text-anchor="middle" fill="#57606a">list_connector_checksums(connector_id)  →  known_checksums</text>
  <text x="300" y="214" text-anchor="middle" fill="#57606a">list_all_checksums()  →  all_checksums (cross-connector dedup)</text>
  <line x1="300" y1="218" x2="300" y2="238" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sw-arr)"/>

  <!-- ③ scanner connect + scan -->
  <rect x="80" y="238" width="440" height="48" rx="4" fill="#dbeafe" stroke="#3b82d4" stroke-width="1"/>
  <text x="300" y="253" text-anchor="middle" fill="#1e40af" font-weight="600">③ scanner.connect() · scanner.scan()</text>
  <text x="300" y="268" text-anchor="middle" fill="#57606a">walks ALL remote files · yields (remote_path, checksum)</text>
  <text x="300" y="282" text-anchor="middle" fill="#57606a">SFTP: remote md5sum · S3: ETag from list_objects_v2</text>
  <line x1="300" y1="286" x2="300" y2="306" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sw-arr)"/>

  <!-- ④ classify -->
  <rect x="80" y="306" width="440" height="60" rx="4" fill="#dbeafe" stroke="#3b82d4" stroke-width="1"/>
  <text x="300" y="321" text-anchor="middle" fill="#1e40af" font-weight="600">④ _classify(scanned_files, known_checksums, all_checksums)</text>
  <text x="300" y="336" text-anchor="middle" fill="#57606a">ingest_list      — new to all connectors · download + ingest</text>
  <text x="300" y="350" text-anchor="middle" fill="#57606a">cross_dup_list  — known to another connector · membership only</text>
  <text x="300" y="364" text-anchor="middle" fill="#57606a">orphan_checksums — owned here but gone from remote source</text>
  <line x1="300" y1="366" x2="300" y2="386" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sw-arr)"/>

  <!-- ⑤ process new files -->
  <rect x="80" y="386" width="440" height="60" rx="4" fill="#dcfce7" stroke="#2d9a5f" stroke-width="1"/>
  <text x="300" y="401" text-anchor="middle" fill="#166534" font-weight="600">⑤ Phase 4a-new — _process_new_files(ingest_list)</text>
  <text x="300" y="416" text-anchor="middle" fill="#57606a">download → create_job(connector_id) → doc_id</text>
  <text x="300" y="430" text-anchor="middle" fill="#57606a">add_connector_to_membership(connector_id, checksum, doc_id)</text>
  <text x="300" y="444" text-anchor="middle" fill="#57606a">UPDATE documents.metadata (source_checksum, source_type, …)</text>
  <line x1="300" y1="446" x2="300" y2="466" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sw-arr)"/>

  <!-- ⑥ process cross-dup files -->
  <rect x="80" y="466" width="440" height="48" rx="4" fill="#dcfce7" stroke="#2d9a5f" stroke-width="1"/>
  <text x="300" y="481" text-anchor="middle" fill="#166534" font-weight="600">⑥ Phase 4a-dup — _process_cross_dup_files(cross_dup_list)</text>
  <text x="300" y="496" text-anchor="middle" fill="#57606a">lookup_connector_content_by_checksum(checksum) → existing_doc_id</text>
  <text x="300" y="510" text-anchor="middle" fill="#57606a">add_connector_to_membership(connector_id, checksum, existing_doc_id)</text>
  <line x1="300" y1="514" x2="300" y2="534" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sw-arr)"/>

  <!-- ⑦ delete orphans (runs after ALL 4a writes) -->
  <rect x="80" y="534" width="440" height="48" rx="4" fill="#fef3c7" stroke="#ca8a04" stroke-width="1"/>
  <text x="300" y="549" text-anchor="middle" fill="#854d0e" font-weight="600">⑦ Phase 4b — _delete_orphans(orphan_checksums)</text>
  <text x="300" y="564" text-anchor="middle" fill="#57606a">runs AFTER all Phase 4a writes complete</text>
  <text x="300" y="578" text-anchor="middle" fill="#57606a">remove_connector_from_membership → delete doc if remaining == 0</text>
  <line x1="300" y1="582" x2="300" y2="602" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sw-arr)"/>

  <!-- ⑧ close tick -->
  <rect x="80" y="602" width="440" height="48" rx="4" fill="#dcfce7" stroke="#2d9a5f" stroke-width="1"/>
  <text x="300" y="617" text-anchor="middle" fill="#166534" font-weight="600">⑧ Phase 5 — finalise tick</text>
  <text x="300" y="632" text-anchor="middle" fill="#57606a">UPDATE connector_sync_history (finished_at, counters, status)</text>
  <text x="300" y="646" text-anchor="middle" fill="#57606a">UPDATE connectors (last_sync_at, sync_status)</text>
  <line x1="300" y1="650" x2="300" y2="670" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sw-arr)"/>

  <!-- ⑨ close + sleep -->
  <rect x="80" y="670" width="440" height="36" rx="4" fill="#f7f8fa" stroke="#57606a" stroke-width="1"/>
  <text x="300" y="683" text-anchor="middle" fill="#57606a" font-weight="600">⑨ finally: scanner.close() · sleep(sync_interval_seconds)</text>
  <text x="300" y="698" text-anchor="middle" fill="#57606a">exit if stop_event is set · else loop to tick guard</text>

  <!-- exception side path — from ⑤ block right edge down to ⑧ -->
  <line x1="520" y1="460" x2="590" y2="460" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="590" y1="460" x2="590" y2="638" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="590" y1="638" x2="522" y2="638" stroke="#c0392b" stroke-width="1.5" marker-end="url(#sw-arrr)"/>
  <text x="596" y="554" font-size="11" fill="#c0392b" transform="rotate(-90,596,554)">Exception → _fail_tick(sync_id, exc)</text>

  <!-- loop-back arrow from sleep block left edge back to tick guard -->
  <line x1="80" y1="688" x2="44" y2="688" stroke="#2d9a5f" stroke-width="1.5"/>
  <line x1="44" y1="688" x2="44" y2="52" stroke="#2d9a5f" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="44" y1="52" x2="202" y2="52" stroke="#2d9a5f" stroke-width="1.5" marker-end="url(#sw-arrg)"/>
  <text x="20" y="420" font-size="11" fill="#2d9a5f" transform="rotate(-90,20,420)">next tick loop</text>
</svg>
