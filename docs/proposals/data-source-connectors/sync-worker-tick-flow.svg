<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 700" width="560" height="700" font-family="-apple-system, Segoe UI, system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="sw-arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3b82d4"/></marker>
    <marker id="sw-arrg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2d9a5f"/></marker>
    <marker id="sw-arrr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#c0392b"/></marker>
    <marker id="sw-arro" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#ca8a04"/></marker>
  </defs>

  <!-- tick guard diamond -->
  <polygon points="280,14 360,50 280,86 200,50" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="280" y="46" text-anchor="middle" font-weight="600" fill="#854d0e">tick already</text>
  <text x="280" y="61" text-anchor="middle" font-weight="600" fill="#854d0e">running?</text>

  <!-- YES → skip -->
  <line x1="360" y1="50" x2="470" y2="50" stroke="#c0392b" stroke-width="1.5" marker-end="url(#sw-arrr)"/>
  <rect x="470" y="33" width="80" height="34" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1"/>
  <text x="510" y="54" text-anchor="middle" font-weight="600" fill="#991b1b">Skip tick</text>
  <text x="368" y="44" font-size="11" fill="#c0392b">YES</text>

  <!-- NO → down -->
  <line x1="280" y1="86" x2="280" y2="110" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sw-arr)"/>
  <text x="288" y="104" font-size="11" fill="#57606a">NO</text>

  <!-- ① insert sync_history -->
  <rect x="90" y="110" width="380" height="36" rx="4" fill="#dbeafe" stroke="#3b82d4" stroke-width="1"/>
  <text x="280" y="123" text-anchor="middle" fill="#1e40af" font-weight="600">① insert sync_history row</text>
  <text x="280" y="138" text-anchor="middle" fill="#57606a">status = syncing · files_syncing = 0</text>
  <line x1="280" y1="146" x2="280" y2="166" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sw-arr)"/>

  <!-- ② build scanner -->
  <rect x="90" y="166" width="380" height="36" rx="4" fill="#dbeafe" stroke="#3b82d4" stroke-width="1"/>
  <text x="280" y="179" text-anchor="middle" fill="#1e40af" font-weight="600">② build_scanner(config) · scanner.connect()</text>
  <text x="280" y="194" text-anchor="middle" fill="#57606a">SFTP or S3 selected by config.type</text>
  <line x1="280" y1="202" x2="280" y2="222" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sw-arr)"/>

  <!-- ③ load known hashes -->
  <rect x="90" y="222" width="380" height="36" rx="4" fill="#dbeafe" stroke="#3b82d4" stroke-width="1"/>
  <text x="280" y="235" text-anchor="middle" fill="#1e40af" font-weight="600">③ list_connector_hashes(connector_id)</text>
  <text x="280" y="250" text-anchor="middle" fill="#57606a">load SHA-256 set from connector_file_membership</text>
  <line x1="280" y1="258" x2="280" y2="278" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sw-arr)"/>

  <!-- ④ scan remote -->
  <rect x="90" y="278" width="380" height="36" rx="4" fill="#dbeafe" stroke="#3b82d4" stroke-width="1"/>
  <text x="280" y="291" text-anchor="middle" fill="#1e40af" font-weight="600">④ scanner.scan(known_hashes)</text>
  <text x="280" y="306" text-anchor="middle" fill="#57606a">list remote files · compute SHA-256 per file</text>
  <line x1="280" y1="314" x2="280" y2="334" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sw-arr)"/>

  <!-- ⑤ diff -->
  <rect x="90" y="334" width="380" height="36" rx="4" fill="#dbeafe" stroke="#3b82d4" stroke-width="1"/>
  <text x="280" y="347" text-anchor="middle" fill="#1e40af" font-weight="600">⑤ _diff(remote_files, known_hashes)</text>
  <text x="280" y="362" text-anchor="middle" fill="#57606a">→ to_ingest (new hashes) · orphan_hashes (removed)</text>
  <line x1="280" y1="370" x2="280" y2="390" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sw-arr)"/>

  <!-- ⑥ process new files -->
  <rect x="90" y="390" width="380" height="48" rx="4" fill="#dcfce7" stroke="#2d9a5f" stroke-width="1"/>
  <text x="280" y="406" text-anchor="middle" fill="#166534" font-weight="600">⑥ _process_new_files(sync_id, scanner, to_ingest)</text>
  <text x="280" y="421" text-anchor="middle" fill="#57606a">reuse globally-known docs · stage per-tick tmpdir</text>
  <text x="280" y="434" text-anchor="middle" fill="#57606a">download + ingest new · update files_syncing live</text>
  <line x1="280" y1="438" x2="280" y2="458" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sw-arr)"/>

  <!-- ⑦ delete orphans -->
  <rect x="90" y="458" width="380" height="36" rx="4" fill="#fef3c7" stroke="#ca8a04" stroke-width="1"/>
  <text x="280" y="471" text-anchor="middle" fill="#854d0e" font-weight="600">⑦ _delete_orphans(orphan_hashes)</text>
  <text x="280" y="486" text-anchor="middle" fill="#57606a">decrement ref counts · delete when last connector releases</text>
  <line x1="280" y1="494" x2="280" y2="514" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sw-arr)"/>

  <!-- ⑧ complete tick -->
  <rect x="90" y="514" width="380" height="36" rx="4" fill="#dcfce7" stroke="#2d9a5f" stroke-width="1"/>
  <text x="280" y="527" text-anchor="middle" fill="#166534" font-weight="600">⑧ _complete_tick(sync_id)</text>
  <text x="280" y="542" text-anchor="middle" fill="#57606a">finalize sync_history · update active_connectors status</text>
  <line x1="280" y1="550" x2="280" y2="570" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sw-arr)"/>

  <!-- ⑨ close + sleep -->
  <rect x="90" y="570" width="380" height="36" rx="4" fill="#f7f8fa" stroke="#57606a" stroke-width="1"/>
  <text x="280" y="583" text-anchor="middle" fill="#57606a" font-weight="600">⑨ finally: scanner.close() · sleep(interval)</text>
  <text x="280" y="598" text-anchor="middle" fill="#57606a">exit if stop_event is set, else loop to tick guard</text>

  <!-- exception side path -->
  <line x1="470" y1="370" x2="530" y2="370" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="530" y1="370" x2="530" y2="550" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="530" y1="550" x2="472" y2="550" stroke="#c0392b" stroke-width="1.5" marker-end="url(#sw-arrr)"/>
  <text x="536" y="440" font-size="11" fill="#c0392b" transform="rotate(-90,536,440)">Exception → _fail_tick(sync_id, exc)</text>

  <!-- loop-back arrow -->
  <line x1="90" y1="588" x2="60" y2="588" stroke="#2d9a5f" stroke-width="1.5"/>
  <line x1="60" y1="588" x2="60" y2="50" stroke="#2d9a5f" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="60" y1="50" x2="198" y2="50" stroke="#2d9a5f" stroke-width="1.5" marker-end="url(#sw-arrg)"/>
  <text x="36" y="350" font-size="11" fill="#2d9a5f" transform="rotate(-90,36,350)">next tick loop</text>
</svg>
