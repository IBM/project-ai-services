<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 820" width="680" height="820" font-family="-apple-system, Segoe UI, system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="sw-arr"  markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3b82d4"/></marker>
    <marker id="sw-arrg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2d9a5f"/></marker>
    <marker id="sw-arrr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#c0392b"/></marker>
    <marker id="sw-arro" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#ca8a04"/></marker>
  </defs>

  <!-- Entry point — dispatched by APScheduler or POST /sync -->
  <rect x="100" y="10" width="480" height="36" rx="4" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/>
  <text x="340" y="25" text-anchor="middle" font-weight="700" fill="#1e40af">_run_tick(connector_id)  — async coroutine</text>
  <text x="340" y="40" text-anchor="middle" font-size="11" fill="#57606a">dispatched by APScheduler IntervalTrigger  OR  POST /v1/connectors/{id}/sync</text>
  <line x1="340" y1="46" x2="340" y2="66" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sw-arr)"/>

  <!-- ① open tick -->
  <rect x="100" y="66" width="480" height="48" rx="4" fill="#dbeafe" stroke="#3b82d4" stroke-width="1"/>
  <text x="340" y="82" text-anchor="middle" fill="#1e40af" font-weight="600">① Phase 1 — open tick record</text>
  <text x="340" y="97" text-anchor="middle" fill="#57606a">INSERT connector_sync_logs  (seq, started_at, status='started')</text>
  <text x="340" y="111" text-anchor="middle" fill="#57606a">sync_status already 'syncing'  (set by lock-acquisition before dispatch)</text>
  <line x1="340" y1="114" x2="340" y2="134" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sw-arr)"/>

  <!-- ② load known state — inside ingest_lock -->
  <rect x="60" y="134" width="560" height="130" rx="4" fill="#f0fdf4" stroke="#2d9a5f" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="340" y="152" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">── async with _ingest_lock  (held through end of Phase 4a) ──────────────────────</text>

  <rect x="80" y="160" width="520" height="36" rx="4" fill="#dbeafe" stroke="#3b82d4" stroke-width="1"/>
  <text x="340" y="175" text-anchor="middle" fill="#1e40af" font-weight="600">② Phase 2 — load known state</text>
  <text x="340" y="189" text-anchor="middle" fill="#57606a">list_connector_checksums(id) → known_checksums  ·  list_all_checksums() → all_checksums</text>
  <line x1="340" y1="196" x2="340" y2="212" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sw-arr)"/>

  <!-- ③ scanner.connect + scan — inside lock -->
  <rect x="80" y="212" width="520" height="36" rx="4" fill="#dbeafe" stroke="#3b82d4" stroke-width="1"/>
  <text x="340" y="228" text-anchor="middle" fill="#1e40af" font-weight="600">③ scanner.connect()  ·  await scanner.scan()</text>
  <text x="340" y="242" text-anchor="middle" fill="#57606a">walks ALL remote files  ·  yields (remote_path, checksum) per file</text>

  <line x1="340" y1="264" x2="340" y2="280" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sw-arr)"/>

  <!-- ④ classify — inside lock -->
  <rect x="80" y="280" width="520" height="60" rx="4" fill="#dbeafe" stroke="#3b82d4" stroke-width="1"/>
  <text x="340" y="296" text-anchor="middle" fill="#1e40af" font-weight="600">④ _classify(connector_id, scanned_files, known_checksums, all_checksums)</text>
  <text x="340" y="312" text-anchor="middle" fill="#57606a">→ ingest_list       — new to all connectors  (download + ingest)</text>
  <text x="340" y="326" text-anchor="middle" fill="#57606a">→ cross-dup inline  — in all_checksums but not known: add_connector_checksum_entry() immediately</text>
  <text x="340" y="336" text-anchor="middle" fill="#57606a">→ orphan_checksums  — owned here, gone from remote</text>
  <line x1="340" y1="340" x2="340" y2="356" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sw-arr)"/>

  <!-- ⑤ process new files — inside lock -->
  <rect x="80" y="356" width="520" height="60" rx="4" fill="#dcfce7" stroke="#2d9a5f" stroke-width="1"/>
  <text x="340" y="372" text-anchor="middle" fill="#166534" font-weight="600">⑤ Phase 4a — await _process_new_files(ingest_list)</text>
  <text x="340" y="388" text-anchor="middle" fill="#57606a">for each file: download → create_job(connector_id, checksum) → doc_id</text>
  <text x="340" y="402" text-anchor="middle" fill="#57606a">add_connector_checksum_entry(connector_id, checksum, doc_id)  ·  set_document_metadata()</text>
  <text x="340" y="412" text-anchor="middle" fill="#2d9a5f" font-size="11">── _ingest_lock RELEASED after last checksum row committed ──</text>

  <line x1="340" y1="416" x2="340" y2="436" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sw-arr)"/>

  <!-- ⑥ delete orphans — outside lock -->
  <rect x="100" y="436" width="480" height="48" rx="4" fill="#fef3c7" stroke="#ca8a04" stroke-width="1"/>
  <text x="340" y="452" text-anchor="middle" fill="#854d0e" font-weight="600">⑥ Phase 4b — await _delete_orphans(orphan_checksums)</text>
  <text x="340" y="467" text-anchor="middle" fill="#57606a">runs AFTER all Phase 4a writes complete  (lock already released)</text>
  <text x="340" y="481" text-anchor="middle" fill="#57606a">remove_connector_checksum_entry() → if remaining == 0: DELETE /v1/documents/{doc_id}</text>
  <line x1="340" y1="484" x2="340" y2="504" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sw-arr)"/>

  <!-- ⑦ finalise tick -->
  <rect x="100" y="504" width="480" height="48" rx="4" fill="#dcfce7" stroke="#2d9a5f" stroke-width="1"/>
  <text x="340" y="520" text-anchor="middle" fill="#166534" font-weight="600">⑦ Phase 5 — _complete_tick()</text>
  <text x="340" y="536" text-anchor="middle" fill="#57606a">UPDATE connector_sync_logs (finished_at, counters, status='completed')</text>
  <text x="340" y="550" text-anchor="middle" fill="#57606a">UPDATE connectors (last_sync_at, sync_status='completed')</text>
  <line x1="340" y1="552" x2="340" y2="572" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#sw-arr)"/>

  <!-- ⑧ finally: scanner.close() -->
  <rect x="100" y="572" width="480" height="36" rx="4" fill="#f7f8fa" stroke="#57606a" stroke-width="1"/>
  <text x="340" y="588" text-anchor="middle" fill="#57606a" font-weight="600">⑧ finally:  scanner.close()</text>
  <text x="340" y="602" text-anchor="middle" fill="#57606a">always runs — coroutine exits; APScheduler schedules next tick at next interval</text>

  <!-- exception side-rail: from ⑤ right edge down to ⑦ -->
  <line x1="620" y1="386" x2="660" y2="386" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="660" y1="386" x2="660" y2="528" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="660" y1="528" x2="582" y2="528" stroke="#c0392b" stroke-width="1.5" marker-end="url(#sw-arrr)"/>
  <text x="666" y="462" font-size="11" fill="#c0392b" transform="rotate(-90,666,462)">Exception → _fail_tick(sync_seq, exc)</text>

  <!-- fail tick note -->
  <rect x="100" y="636" width="480" height="36" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1"/>
  <text x="340" y="652" text-anchor="middle" fill="#991b1b" font-weight="600">_fail_tick()  — writes sync_status = 'failed: …'</text>
  <text x="340" y="666" text-anchor="middle" fill="#57606a">close_sync_log(seq, status='failed')  ·  UPDATE connectors.sync_status  ·  scanner.close() in finally</text>

  <!-- arrow from finally to fail tick for completeness -->
  <line x1="340" y1="608" x2="340" y2="634" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#sw-arrr)"/>
  <text x="348" y="624" font-size="10" fill="#c0392b">(on exception path)</text>

  <!-- note: APScheduler fires next tick regardless of failure -->
  <rect x="100" y="720" width="480" height="28" rx="4" fill="#f0fdf4" stroke="#2d9a5f" stroke-width="1"/>
  <text x="340" y="739" text-anchor="middle" font-size="11" fill="#166534">APScheduler IntervalTrigger fires the next tick regardless of success or failure</text>
</svg>
