<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 700" width="860" height="700" font-family="-apple-system, Segoe UI, system-ui, sans-serif" font-size="12">
  <defs>
    <marker id="s-arr"  markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3b82d4"/></marker>
    <marker id="s-arrg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2d9a5f"/></marker>
    <marker id="s-arrr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#c0392b"/></marker>
    <marker id="s-arrm" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#7c5cd8"/></marker>
    <marker id="s-arro" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#ca8a04"/></marker>
  </defs>

  <!-- ═══════════════════════════════════════════════════════
       TOP SECTION — Process / concurrency model
       ═══════════════════════════════════════════════════════ -->

  <!-- OS Process outer box -->
  <rect x="10" y="10" width="840" height="180" rx="6" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="26" y="30" font-size="11" font-weight="600" fill="#57606a">OS Process (uvicorn — single worker)</text>

  <!-- Main asyncio event loop box -->
  <rect x="26" y="40" width="380" height="54" rx="4" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/>
  <text x="216" y="58" text-anchor="middle" font-weight="700" fill="#1e40af">asyncio event loop  (FastAPI / Uvicorn)</text>
  <text x="216" y="74" text-anchor="middle" font-size="11" fill="#1e40af">handles HTTP · runs lifespan hooks</text>
  <text x="216" y="88" text-anchor="middle" font-size="11" fill="#1e40af">PUT updates DB only — _run_tick re-reads config each tick</text>

  <!-- APScheduler box — same event loop -->
  <rect x="420" y="40" width="250" height="54" rx="4" fill="#dcfce7" stroke="#2d9a5f" stroke-width="1.5"/>
  <text x="545" y="58" text-anchor="middle" font-weight="700" fill="#166534">APScheduler  AsyncScheduler</text>
  <text x="545" y="74" text-anchor="middle" font-size="11" fill="#166534">one IntervalTrigger job per connector</text>
  <text x="545" y="88" text-anchor="middle" font-size="11" fill="#166534">max_instances=1  ·  runs on same event loop</text>

  <!-- asyncio.Lock note -->
  <rect x="680" y="40" width="160" height="54" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="760" y="58" text-anchor="middle" font-weight="700" fill="#854d0e">asyncio.Lock</text>
  <text x="760" y="74" text-anchor="middle" font-size="11" fill="#854d0e">_ingest_lock</text>
  <text x="760" y="88" text-anchor="middle" font-size="11" fill="#854d0e">Phase 2 → end 4a</text>

  <!-- Note row -->
  <rect x="26" y="110" width="814" height="46" rx="4" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="433" y="129" text-anchor="middle" font-weight="700" fill="#1f2328">ConnectorScheduler  (module-level singleton)</text>
  <text x="433" y="148" text-anchor="middle" font-size="11" fill="#57606a">register_connector_job(id, interval)  ·  remove_connector_job(id)  ·  trigger_now(id)  ·  lifespan: start_in_background() / shutdown()</text>

  <!-- ═══════════════════════════════════════════════════════
       LEGEND
       ═══════════════════════════════════════════════════════ -->
  <rect x="10" y="208" width="152" height="112" rx="4" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="20" y="226" font-weight="600" fill="#1f2328">Legend</text>
  <line x1="20" y1="240" x2="52" y2="240" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#s-arr)"/>
  <text x="58" y="244" fill="#1f2328">API-triggered</text>
  <line x1="20" y1="256" x2="52" y2="256" stroke="#2d9a5f" stroke-width="1.5" marker-end="url(#s-arrg)"/>
  <text x="58" y="260" fill="#1f2328">Scheduler-driven</text>
  <line x1="20" y1="272" x2="52" y2="272" stroke="#c0392b" stroke-width="1.5" marker-end="url(#s-arrr)"/>
  <text x="58" y="276" fill="#1f2328">Error / remove</text>
  <line x1="20" y1="288" x2="52" y2="288" stroke="#7c5cd8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#s-arrm)"/>
  <text x="58" y="292" fill="#1f2328">Startup recovery</text>
  <line x1="20" y1="304" x2="52" y2="304" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#s-arro)"/>
  <text x="58" y="308" fill="#1f2328">No-op guard</text>

  <!-- ═══════════════════════════════════════════════════════
       SCHEDULER JOB LIFECYCLE  (center column)
       ═══════════════════════════════════════════════════════ -->

  <!-- Not Registered -->
  <rect x="310" y="208" width="200" height="36" rx="4" fill="#f7f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="410" y="231" text-anchor="middle" font-weight="700" fill="#57606a">Not Registered</text>

  <!-- arrow: POST /v1/connectors → Registered -->
  <line x1="410" y1="244" x2="410" y2="276" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#s-arr)"/>
  <text x="418" y="265" font-size="11" fill="#57606a">POST /v1/connectors</text>

  <!-- Registered (Idle) -->
  <rect x="310" y="276" width="200" height="36" rx="4" fill="#dcfce7" stroke="#2d9a5f" stroke-width="1.5"/>
  <text x="410" y="296" text-anchor="middle" font-weight="700" fill="#166534">Registered  (Idle)</text>
  <text x="410" y="308" text-anchor="middle" font-size="10" fill="#57606a">sync_status = 'up to date' / 'failed'</text>

  <!-- arrow: IntervalTrigger fires → Tick Running -->
  <line x1="410" y1="314" x2="410" y2="346" stroke="#2d9a5f" stroke-width="1.5" marker-end="url(#s-arrg)"/>
  <text x="418" y="335" font-size="11" fill="#57606a">IntervalTrigger fires</text>

  <!-- Tick Running -->
  <rect x="310" y="346" width="200" height="36" rx="4" fill="#dcfce7" stroke="#2d9a5f" stroke-width="1.5"/>
  <text x="410" y="366" text-anchor="middle" font-weight="700" fill="#166534">Tick Running</text>
  <text x="410" y="378" text-anchor="middle" font-size="10" fill="#57606a">sync_status = 'syncing'</text>

  <!-- arrow: tick completes → Registered (Idle) -->
  <path d="M510,364 C560,364 560,294 512,294" fill="none" stroke="#2d9a5f" stroke-width="1.5" marker-end="url(#s-arrg)"/>
  <text x="530" y="335" font-size="11" fill="#57606a">completed</text>

  <!-- arrow: tick fails → Failed -->
  <line x1="410" y1="382" x2="410" y2="414" stroke="#c0392b" stroke-width="1.5" marker-end="url(#s-arrr)"/>
  <text x="418" y="403" font-size="11" fill="#c0392b">exception</text>

  <!-- Failed -->
  <rect x="310" y="414" width="200" height="36" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
  <text x="410" y="434" text-anchor="middle" font-weight="700" fill="#991b1b">Tick Failed</text>
  <text x="410" y="446" text-anchor="middle" font-size="10" fill="#57606a">sync_status = 'failed: …'  ·  log closed</text>

  <!-- arrow: next IntervalTrigger fires again from Failed → Tick Running -->
  <path d="M310,432 C260,432 260,364 308,364" fill="none" stroke="#2d9a5f" stroke-width="1.5" marker-end="url(#s-arrg)"/>
  <text x="185" y="400" font-size="11" fill="#57606a">next interval</text>
  <text x="185" y="413" font-size="11" fill="#57606a">fires anyway</text>

  <!-- arrow: DELETE /v1/connectors → Removed -->
  <line x1="410" y1="450" x2="410" y2="482" stroke="#c0392b" stroke-width="1.5" marker-end="url(#s-arrr)"/>
  <text x="418" y="471" font-size="11" fill="#c0392b">DELETE /v1/connectors</text>

  <!-- Removed -->
  <rect x="310" y="482" width="200" height="36" rx="4" fill="#f7f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="410" y="505" text-anchor="middle" font-weight="700" fill="#57606a">Removed</text>
  <text x="410" y="517" text-anchor="middle" font-size="10" fill="#57606a">job de-registered · DB row deleted</text>

  <!-- ═══════════════════════════════════════════════════════
       RIGHT COLUMN — POST /sync manual trigger path
       ═══════════════════════════════════════════════════════ -->

  <!-- POST /sync trigger box -->
  <rect x="600" y="276" width="220" height="36" rx="4" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/>
  <text x="710" y="293" text-anchor="middle" font-weight="700" fill="#1e40af">POST /sync request</text>
  <text x="710" y="305" text-anchor="middle" font-size="10" fill="#57606a">try_acquire_sync_lock()</text>

  <!-- arrow from POST /sync to Tick Running (wins lock) -->
  <line x1="600" y1="294" x2="512" y2="362" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#s-arr)"/>
  <text x="538" y="316" font-size="11" fill="#3b82d4">lock acquired →</text>
  <text x="538" y="329" font-size="11" fill="#3b82d4">dispatch _run_tick</text>

  <!-- no-op path: already syncing -->
  <line x1="710" y1="312" x2="710" y2="370" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#s-arro)"/>
  <rect x="634" y="370" width="150" height="36" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
  <text x="709" y="387" text-anchor="middle" font-size="11" font-weight="600" fill="#854d0e">202 no-op</text>
  <text x="709" y="400" text-anchor="middle" font-size="10" fill="#854d0e">already syncing — skip</text>

  <!-- ═══════════════════════════════════════════════════════
       BOTTOM — Startup recovery
       ═══════════════════════════════════════════════════════ -->
  <rect x="190" y="570" width="460" height="36" rx="4" fill="#ede9fe" stroke="#7c5cd8" stroke-width="1"/>
  <text x="420" y="585" text-anchor="middle" font-size="11" font-weight="600" fill="#4c1d95">FastAPI startup  (lifespan hook)</text>
  <text x="420" y="599" text-anchor="middle" font-size="11" fill="#4c1d95">_scheduler.start_in_background()  →  iterate list_connectors()  →  register_connector_job() for each  →  replace_existing=True</text>

  <!-- arrow from startup box to Registered (Idle) -->
  <line x1="420" y1="570" x2="412" y2="514" stroke="#7c5cd8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#s-arrm)"/>
</svg>
