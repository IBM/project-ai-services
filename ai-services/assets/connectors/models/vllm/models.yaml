  certified_by: BAAI
  about:
    - title: "Model strengths"
      sections:
        - title: "Strengths"
          values:
            - Reliable instruction-following
            - Contextual reasoning
            - Accurate response generation across a wide range of natural language tasks from summarization and question answering to prompt-driven workflows
