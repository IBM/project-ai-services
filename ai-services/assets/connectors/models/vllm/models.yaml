- id: ibm-granite/granite-embedding-278m-multilingual
  name: Granite Embedding 278M Multilingual
  description: "A 278M parameter multilingual embedding model for semantic search and document retrieval across 100+ languages."
  license: Apache-2.0
  certified_by: IBM
  about:
    - title: "Model strengths"
      sections:
        - title: "Strengths"
          values:
            - Excellent multilingual support
            - Efficient 278M parameter model
            - Strong performance across diverse languages
        - title: "Use cases"
          values:
            - Cross-lingual semantic search
            - Multilingual document retrieval
            - International content matching
    - title: "Supported languages"
      sections:
        - title: "Languages"
          values:
            - Multilingual (100+ languages)
