apiVersion: apps/v1
kind: Deployment
metadata:
  name: "chat-bot-ui"
  labels:
    ai-services.io/service: {{ .Release.Name }}
    ai-services.io/template: {{ .Values.templateID }}
    ai-services.io/version: {{ default .Chart.AppVersion | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      ai-services.io/service: {{ .Release.Name }}
      ai-services.io/component: chat-bot-ui
  template:
    metadata:
      labels:
        ai-services.io/service: {{ .Release.Name }}
        ai-services.io/template: {{ .Values.templateID }}
        ai-services.io/component: chat-bot-ui
        ai-services.io/component-type: ui
        ai-services.io/version: {{ default .Chart.AppVersion | quote }}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.authCatalogHostAliases }}
      hostAliases:
      {{- range .Values.authCatalogHostAliases }}
      - ip: "{{ or .IP .ip }}"
        hostnames:
        {{- range or .Hostnames .hostnames }}
          - "{{ . }}"
        {{- end }}
      {{- end }}
      {{- end }}
      containers:
        - name: ui
          image: "{{ .Values.ui.image }}"
          resources:
            requests:
              cpu: {{ .Values.ui.resources.requests.cpu | quote }}
              memory: {{ .Values.ui.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.ui.resources.limits.cpu | quote }}
              memory: {{ .Values.ui.resources.limits.memory | quote }}
          env:
            - name: BACKEND_HOST
              value: "chat-bot-backend"
            - name: BACKEND_PORT
              value: "5000"
            {{- if .Values.authCatalogCaBundleSecret }}
            - name: AUTH_CATALOG_CA_BUNDLE
              value: "/etc/ssl/certs/catalog-ca-bundle.crt"
            {{- end }}
          # Sign-in: the UI's Nginx trades the one-time code for a token at the catalog. CATALOG_API_URL
          # and CATALOG_UI_URL come from the shared catalog-auth secret.
          envFrom:
            - secretRef:
                name: "catalog-auth"
          ports:
            - containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          {{- if .Values.authCatalogCaBundleSecret }}
          volumeMounts:
            - mountPath: /etc/ssl/certs/catalog-ca-bundle.crt
              subPath: ca-bundle.crt
              name: ca-bundle
              readOnly: true
          {{- end }}
      {{- if .Values.authCatalogCaBundleSecret }}
      volumes:
        - name: ca-bundle
          secret:
            secretName: {{ .Values.authCatalogCaBundleSecret | quote }}
      {{- end }}
