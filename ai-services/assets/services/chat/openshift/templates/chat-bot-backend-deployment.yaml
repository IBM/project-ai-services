apiVersion: apps/v1
kind: Deployment
metadata:
  name: "chat-bot-api"
  labels:
    ai-services.io/service: {{ .Release.Name }}
    ai-services.io/template: {{ .Values.templateID }}
    ai-services.io/version: {{ default .Chart.AppVersion | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      ai-services.io/service: {{ .Release.Name }}
      ai-services.io/component: chat-bot-backend
  template:
    metadata:
      labels:
        ai-services.io/service: {{ .Release.Name }}
        ai-services.io/template: {{ .Values.templateID }}
        ai-services.io/component: chat-bot-backend
        ai-services.io/version: {{ default .Chart.AppVersion | quote }}
        ai-services.io/component-type: api
    spec:
      automountServiceAccountToken: false
      {{- if .Values.authCatalogHostAliases }}
      hostAliases:
      {{- range .Values.authCatalogHostAliases }}
      - ip: "{{ or .IP .ip }}"
        hostnames:
        {{- range or .Hostnames .hostnames }}
          - "{{ . }}"
        {{- end }}
      {{- end }}
      {{- end }}
      containers:
        - name: backend-server
          image: "{{ .Values.backend.image }}"
          command:
            - "/var/venv/bin/python"
            - "-m"
            - "uvicorn"
            - "app:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "5000"
            - "--loop"
            - "uvloop"
            - "--http"
            - "httptools"
          env:
            - name: EMB_ENDPOINT
              value: http://embedding-predictor:8000
            - name: EMB_MODEL
              value: {{ .Values.embedding.model | quote }}
            - name: EMB_MAX_MODEL_LEN
              value: {{ .Values.embedding.maxModelLen | quote }}
            - name: LLM_ENDPOINT
              value: http://llm-predictor:8000
            - name: LLM_MODEL
              value: {{ .Values.llm.model | quote }}
            - name: LLM_MAX_MODEL_LEN
              value: {{ .Values.llm.maxModelLen | quote }}
            - name: LLM_MAX_BATCH_SIZE
              value: {{ .Values.llm.maxBatchSize | quote }}
            - name: OPENSEARCH_HOST
              value: "opensearch"
            - name: OPENSEARCH_PORT
              value: "9200"
            - name: OPENSEARCH_DB_PREFIX
              value: "RAG_DB"
            - name: OPENSEARCH_INDEX_NAME
              value: "RAG_INDEX"
            - name: OPENSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: "opensearch-credentials"
                  key: username
            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "opensearch-credentials"
                  key: password
            - name: OPENSEARCH_NUM_SHARDS
              value: "{{ .Values.opensearch.numShards }}"
            - name: LOG_LEVEL
              value: "{{ .Values.backend.log_level }}"
            - name: CHATBOT_SEARCH_MODE
              value: "{{ .Values.chatbot.searchMode }}"
            - name: CHATBOT_NUM_CHUNKS_POST_RERANKER
              value: "{{ .Values.chatbot.numChunksPostReranker }}"
            - name: CHATBOT_RERANK
              value: "{{ .Values.chatbot.rerank }}"
            - name: CHATBOT_SYSTEM_PROMPT
              value: "{{ .Values.backend.systemPrompt }}"
            - name: CHATBOT_SIMILARITY_SERVICE_URL
              value: "http://similarity-api:7000"
            # Inbound auth: every route except /health, /ready and /openapi.json needs a catalog token.
            - name: AUTH_JWKS_URL
              value: "{{ .Values.authJwksUrl }}"
            - name: AUTH_AUDIENCE
              value: "{{ .Values.authAudience }}"
          {{- if .Values.authJwksPlaintextHosts }}
            - name: AUTH_JWKS_PLAINTEXT_HOSTS
              value: "{{ .Values.authJwksPlaintextHosts }}"
          {{- end }}
          {{- if .Values.authCatalogCaBundle }}
            - name: AUTH_CATALOG_CA_BUNDLE
              value: "/etc/ssl/certs/catalog-ca-bundle.crt"
          {{- end }}
          {{- if .Values.authServiceCredential }}
            # Credential to obtain a similarity token from the catalog. Mounted from a Secret, never a literal value.
            - name: AUTH_SERVICE_CREDENTIAL_FILE
              value: "/etc/secret/service-credential/credential"
            - name: AUTH_CATALOG_API_URL
              value: "{{ .Values.authCatalogApiUrl }}"
          {{- end }}
          {{- if .Values.llm.apiKey }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: "vllm-instruct-api-key"
                  key: apiKey
          {{- end }}
          ports:
            - containerPort: 5000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.backend.resources.requests.cpu | quote }}
              memory: {{ .Values.backend.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.backend.resources.limits.cpu | quote }}
              memory: {{ .Values.backend.resources.limits.memory | quote }}
          {{- if or .Values.authServiceCredential .Values.authCatalogCaBundle }}
          volumeMounts:
          {{- if .Values.authServiceCredential }}
            - mountPath: /etc/secret/service-credential
              name: service-credential
              readOnly: true
          {{- end }}
          {{- if .Values.authCatalogCaBundle }}
            - mountPath: /etc/ssl/certs/catalog-ca-bundle.crt
              subPath: ca-bundle.crt
              name: ca-bundle
              readOnly: true
          {{- end }}
          {{- end }}
        {{- if .Values.mcp.enabled }}
        # No readinessProbe: a pod is only Ready when every container is, so a
        # failing sidecar would pull the backend out of the Service endpoints
        - name: mcp-sidecar
          image: "{{ .Values.mcp.image }}"
          args:
            - "--description"
            - "http://localhost:5000/openapi.json"
            - "--endpoint"
            - "http://localhost:5000"
            - "--tag"
            - "mcp"
            - "--port"
            - {{ .Values.mcp.port | quote }}
            - "--auth-passthrough"
            - "--http"
          ports:
            - containerPort: {{ .Values.mcp.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.mcp.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.mcp.resources.requests.cpu | quote }}
              memory: {{ .Values.mcp.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.mcp.resources.limits.cpu | quote }}
              memory: {{ .Values.mcp.resources.limits.memory | quote }}
        {{- end }}
      {{- if or .Values.authServiceCredential .Values.authCatalogCaBundle }}
      volumes:
      {{- if .Values.authServiceCredential }}
        - name: service-credential
          secret:
            secretName: "chat-service-credential"
      {{- end }}
      {{- if .Values.authCatalogCaBundle }}
        - name: ca-bundle
          configMap:
            name: "chat-ca-bundle"
      {{- end }}
      {{- end }}
