{{- if .Values.authServiceCredential }}
apiVersion: v1
kind: Secret
metadata:
  name: "chat-service-credential"
  labels:
    ai-services.io/service: {{ .Release.Name }}
    ai-services.io/template: {{ .Values.templateID }}
type: Opaque
stringData:
  credential: {{ .Values.authServiceCredential | quote }}
{{- end }}
