ui:
  image: icr.io/ai-services-cicd/chatbot-ui:v0.0.50
  resources:
    requests:
      memory: "512Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "50m"

backend:
  image: icr.io/ai-services-cicd/chatbot-service:v0.0.25
  log_level: "INFO"
  systemPrompt: "You are a helpful, conversational AI assistant. Engage naturally with users across multiple turns of conversation. Provide clear, accurate, and contextually relevant responses. Reference previous exchanges when appropriate to maintain conversation flow."
  resources:
    requests:
      memory: "1Gi"
      cpu: "1"
    limits:
      memory: "1Gi"
      cpu: "1"

chatbot:
  searchMode: "hybrid"
  numChunksPostReranker: 3
  rerank: true

embedding:
  model:
    name: ""

llm:
  model:
    name: ""
  apiKey: ""

reranker:
  model:
    name: ""

opensearch:
  numShards: 1
  auth:
    username: "admin"
    password: ""
