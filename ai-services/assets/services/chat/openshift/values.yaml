ui:
  image: icr.io/ai-services-cicd/chatbot-ui:v0.0.66
  resources:
    requests:
      memory: "512Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "50m"

backend:
  image: icr.io/ai-services-cicd/chatbot-service:v0.0.43
  log_level: "INFO"
  systemPrompt: "You are a helpful, conversational AI assistant. Engage naturally with users across multiple turns of conversation. Provide clear, accurate, and contextually relevant responses. Reference previous exchanges when appropriate to maintain conversation flow."
  resources:
    requests:
      memory: "1Gi"
      cpu: "1"
    limits:
      memory: "1Gi"
      cpu: "1"

chatbot:
  searchMode: "hybrid"
  numChunksPostReranker: 3
  rerank: true

opensearch:
  numShards: 1

mcp:
  enabled: true
  image: icr.io/ai-services-cicd/ai-services-mcp:v0.0.10
  port: 5001
  routeTimeout: 5m
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "128Mi"

# Inbound auth: chat verifies catalog tokens whose audience is authAudience. The catalog sets
# authJwksUrl and authCatalogApiUrl at deploy time.
# Outbound auth: chat trades a service credential for a short-lived similarity token. The
# catalog creates the credential and its Secret at deploy time and sets authServiceCredentialSecret
# to the Secret's name; the credential itself never passes through values. Never set it here.
authJwksUrl: ""
authAudience: "chat"
authCatalogApiUrl: ""
# Address of the catalog UI (sign-in page). Set by the catalog at deploy time; empty means the UI infers it.
authCatalogUiUrl: ""
authCatalogCaBundle: ""
authCatalogHostAliases: ""
# @credential:service grants=similarity:read
authServiceCredentialSecret: ""
# Comma-separated hosts allowed to be reached over plain HTTP. Empty (HTTPS only) by default.
authJwksPlaintextHosts: ""
