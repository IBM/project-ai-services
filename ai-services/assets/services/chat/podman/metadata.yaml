name: chat
version: "1.0.0"
podTemplateExecutions:
  - [chat-credential-secret.yaml.tmpl, chat-ca-secret.yaml.tmpl]
  - [chat-bot.yaml.tmpl]

# Resource requirements (UI + Backend)
resources:
  cpu: 1 # 50m (UI) + 1 (Backend) = ~1 core
  memory: 1610612736 # 512Mi (UI) + 1Gi (Backend) = 1.5Gi in bytes
  storage: 0 # No persistent storage required
