summarize:
  image: icr.io/ai-services-cicd/summarize-service:v0.0.30
  log_level: "INFO"
  database: "summarize_metadata"
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

postgres:
  image: icr.io/ai-services-cicd/postgres:18-8
  storage: 5Gi
  # @generate:password
  password: ""

mcp:
  enabled: true
  image: icr.io/ai-services-cicd/ai-services-mcp:v0.0.9
  port: 6001
  routeTimeout: 5m
  resources:
    requests:
      cpu: "50m"
      memory: "512Mi"
    limits:
      cpu: "250m"
      memory: "512Mi"

