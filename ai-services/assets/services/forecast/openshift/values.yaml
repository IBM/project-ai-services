forecast:
  image: icr.io/ai-services-cicd/forecast-service:v0.0.4
  log_level: "INFO"
  database: "forecast_metadata"
  # @generate:password length=32, special=false
  dbEncryptionKey: ""
  workerUsername: "forecast_worker"
  # @generate:password
  workerPassword: ""
  resources:
    requests:
      cpu: "to be provided by DEV"
      memory: "to be provided by DEV"
    limits:
      cpu: "to be provided by DEV"
      memory: "to be provided by DEV"

postgres:
  image: icr.io/ai-services-cicd/postgres:18-8
  storage: 5Gi
  # @generate:password
  password: ""

# The catalog addresses (JWKS URL, plaintext hosts) come from the shared "catalog-auth" secret
# that the catalog creates in the namespace at deploy time.
authAudience: "forecast"
# Name of the Secret that holds the catalog CA bundle. Set by the catalog at deploy time when it
# has one; the PEM itself never passes through values.
authCatalogCaBundleSecret: ""
