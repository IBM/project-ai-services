apiVersion: v1
kind: Secret
metadata:
  name: "forecast-db-encryption-secret"
  labels:
    ai-services.io/service: {{ .Release.Name }}
    ai-services.io/template: {{ .Values.templateID }}
    ai-services.io/version: {{ default .Chart.AppVersion | quote }}
type: Opaque
stringData:
  db-encryption-key: "{{ .Values.forecast.dbEncryptionKey }}"
