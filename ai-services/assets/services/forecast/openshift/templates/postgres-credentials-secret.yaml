apiVersion: v1
kind: Secret
metadata:
  name: "forecast-db-secret"
  labels:
    ai-services.io/service: {{ .Release.Name }}
    ai-services.io/template: {{ .Values.templateID }}
    ai-services.io/version: {{ default .Chart.AppVersion | quote }}
    ai-services.io/component: database
type: Opaque
stringData:
  username: "postgres"
  password: "{{ .Values.postgres.password }}"
  worker_username: "{{ .Values.forecast.workerUsername }}"
  worker_password: "{{ .Values.forecast.workerPassword }}"
