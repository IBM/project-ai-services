apiVersion: apps/v1
kind: Deployment
metadata:
  name: "forecast-api"
  labels:
    ai-services.io/service: {{ .Release.Name }}
    ai-services.io/template: {{ .Values.templateID }}
    ai-services.io/version: {{ default .Chart.AppVersion | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      ai-services.io/service: {{ .Release.Name }}
      ai-services.io/component: forecast-api
  template:
    metadata:
      labels:
        ai-services.io/service: {{ .Release.Name }}
        ai-services.io/template: {{ .Values.templateID }}
        ai-services.io/component: forecast-api
        ai-services.io/component-type: api
        ai-services.io/version: {{ default .Chart.AppVersion | quote }}
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: forecast-db-wait
          image: "{{ .Values.postgres.image }}"
          command:
            - "/bin/sh"
            - "-c"
            - |
              RETRIES=0
              MAX_RETRIES=60
              until pg_isready -h forecast-db -p 5432; do
                RETRIES=$((RETRIES + 1))
                if [ "$RETRIES" -ge "$MAX_RETRIES" ]; then
                  echo "ERROR: forecast-db did not become ready after $((MAX_RETRIES * 5)) seconds. Giving up."
                  exit 1
                fi
                echo "Waiting for forecast-db to be ready... ($RETRIES/$MAX_RETRIES)"
                sleep 5
              done
        - name: forecast-db-init
          image: "{{ .Values.forecast.image }}"
          command: [ "/var/venv/bin/python", "db/scripts/init_db.py" ]
          env:
            - name: POSTGRES_HOST
              value: "forecast-db"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "{{ .Values.forecast.database }}"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "forecast-db-secret"
                  key: password
            - name: WORKER_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: "forecast-db-secret"
                  key: worker_username
            - name: WORKER_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "forecast-db-secret"
                  key: worker_password
      containers:
        - name: forecast-api
          image: "{{ .Values.forecast.image }}"
          command:
            - "/bin/sh"
            - "-c"
          args:
            - |
              export DB_ENCRYPTION_KEY=$(cat /etc/secret/forecast-db-encryption-secret/db-encryption-key)
              exec /var/venv/bin/python -m uvicorn app:app \
                --host 0.0.0.0 \
                --port 8500 \
                --loop uvloop \
                --http httptools
          env:
            - name: POSTGRES_HOST
              value: "forecast-db"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "{{ .Values.forecast.database }}"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "forecast-db-secret"
                  key: password
            - name: WORKER_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: "forecast-db-secret"
                  key: worker_username
            - name: WORKER_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "forecast-db-secret"
                  key: worker_password
            - name: DB_POOL_SIZE
              value: "5"
            - name: DB_MAX_OVERFLOW
              value: "5"
            - name: PORT
              value: "8500"
            - name: TRITON_URL
              value: "http://triton:8000"
            - name: MODEL_REPO_PATH
              value: "/models"
            - name: LOG_LEVEL
              value: "{{ .Values.forecast.log_level }}"
          ports:
            - containerPort: 8500
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8500
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8500
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.forecast.resources.requests.cpu | quote }}
              memory: {{ .Values.forecast.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.forecast.resources.limits.cpu | quote }}
              memory: {{ .Values.forecast.resources.limits.memory | quote }}
          volumeMounts:
            - mountPath: /models
              name: repository
            - mountPath: /etc/secret/forecast-db-encryption-secret
              name: forecast-db-encryption-secret
              readOnly: true
      volumes:
        - name: repository
          persistentVolumeClaim:
            claimName: triton-repository
        - name: forecast-db-encryption-secret
          secret:
            secretName: forecast-db-encryption-secret
