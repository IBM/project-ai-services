containers:
  - name: "digitize-ui"
    workload: "digitize-ui"
    format: ".Status"
    alias: UI_STATUS

  - name: "digitize-api"
    workload: "digitize-api"
    format: ".Status"
    alias: API_STATUS

  - name: "mcp-sidecar"
    workload: "digitize-api"
    format: ".Status"
    alias: MCP_STATUS

hosts:
  - fetch: UI_URL
    type: ui
  - fetch: API_URL
    type: api
  - fetch: MCP_URL
    type: mcp
