apiVersion: apps/v1
kind: Deployment
metadata:
  name: "digitize-ui"
  labels:
    ai-services.io/service: {{ .Release.Name }}
    ai-services.io/template: {{ .Values.templateID }}
    ai-services.io/version: {{ default .Chart.AppVersion | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      ai-services.io/service: {{ .Release.Name }}
      ai-services.io/component: digitize-ui
  template:
    metadata:
      labels:
        ai-services.io/service: {{ .Release.Name }}
        ai-services.io/template: {{ .Values.templateID }}
        ai-services.io/component: digitize-ui
        ai-services.io/component-type: ui
        ai-services.io/version: {{ default .Chart.AppVersion | quote }}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.authCatalogHostAliases }}
      hostAliases:
      {{- range .Values.authCatalogHostAliases }}
      - ip: "{{ or .IP .ip }}"
        hostnames:
        {{- range or .Hostnames .hostnames }}
          - "{{ . }}"
        {{- end }}
      {{- end }}
      {{- end }}
      containers:
        - name: digitize-ui
          image: "{{ .Values.digitizeUi.image }}"
          resources:
            requests:
              cpu: {{ .Values.digitizeUi.resources.requests.cpu | quote }}
              memory: {{ .Values.digitizeUi.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.digitizeUi.resources.limits.cpu | quote }}
              memory: {{ .Values.digitizeUi.resources.limits.memory | quote }}
          env:
            - name: BACKEND_HOST
              value: "digitize-api"
            - name: BACKEND_PORT
              value: "4000"
            {{- if .Values.authCatalogApiUrl }}
            - name: CATALOG_API_URL
              value: "{{ .Values.authCatalogApiUrl }}"
            {{- end }}
            {{- if .Values.authCatalogCaBundle }}
            - name: AUTH_CATALOG_CA_BUNDLE
              value: "/etc/ssl/certs/catalog-ca-bundle.crt"
            {{- end }}
          ports:
            - containerPort: 4001
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 4001
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 4001
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          {{- if .Values.authCatalogCaBundle }}
          volumeMounts:
            - mountPath: /etc/ssl/certs/catalog-ca-bundle.crt
              subPath: ca-bundle.crt
              name: ca-bundle
              readOnly: true
          {{- end }}
      {{- if .Values.authCatalogCaBundle }}
      volumes:
        - name: ca-bundle
          configMap:
            name: "digitize-ca-bundle"
      {{- end }}
