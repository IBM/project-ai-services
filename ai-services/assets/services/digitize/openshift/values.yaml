digitize:
  image: icr.io/ai-services-cicd/digitize-service:v0.0.95
  log_level: "INFO"
  database: "digitize_metadata"
  numShards: 1
  # @generate:password length=32, special=false
  dbEncryptionKey: ""
  resources:
    requests:
      cpu: "16"
      memory: "50Gi"
    limits:
      cpu: "16"
      memory: "50Gi"

digitizeUi:
  image: icr.io/ai-services-cicd/digitize-ui:v0.0.51
  resources:
    requests:
      cpu: "50m"
      memory: "512Mi"
    limits:
      cpu: "50m"
      memory: "512Mi"

postgres:
  image: icr.io/ai-services-cicd/postgres:18-8
  storage: 5Gi
  # @generate:password
  password: ""

embedding:
  model:
    name: ""

mcp:
  enabled: true
  image: icr.io/ai-services-cicd/ai-services-mcp:v0.0.10
  port: 4002
  routeTimeout: 5m
  resources:
    requests:
      cpu: "50m"
      memory: "512Mi"
    limits:
      cpu: "250m"
      memory: "512Mi"

# The catalog addresses (JWKS URL, API URL, UI URL, plaintext hosts) come from the shared
# "catalog-auth" secret that the catalog creates in the namespace at deploy time.
authAudience: "digitize"
# Name of the Secret that holds the catalog CA bundle. Set by the catalog at deploy time when it
# has one; the PEM itself never passes through values.
authCatalogCaBundleSecret: ""
authCatalogHostAliases: ""

