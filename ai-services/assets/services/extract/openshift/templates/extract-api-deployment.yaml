apiVersion: apps/v1
kind: Deployment
metadata:
  name: "extract-api"
  labels:
    ai-services.io/service: {{ .Release.Name }}
    ai-services.io/template: {{ .Values.templateID }}
    ai-services.io/version: {{ default .Chart.AppVersion | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      ai-services.io/service: {{ .Release.Name }}
      ai-services.io/component: extract-api
  template:
    metadata:
      labels:
        ai-services.io/service: {{ .Release.Name }}
        ai-services.io/template: {{ .Values.templateID }}
        ai-services.io/component: extract-api
        ai-services.io/component-type: api
        ai-services.io/version: {{ default .Chart.AppVersion | quote }}
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: extract-db-wait
          image: "{{ .Values.postgres.image }}"
          command:
            - "/bin/sh"
            - "-c"
            - |
              until pg_isready -h extract-db -p 5432; do
                echo "Waiting for extract-db to be ready..."
                sleep 5
              done
        - name: extract-db-init
          image: "{{ .Values.extract.image }}"
          command: [ "/var/venv/bin/python", "db/scripts/init_db.py" ]
          env:
            - name: POSTGRES_HOST
              value: "extract-db"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "{{ .Values.extract.database }}"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "extract-db-secret"
                  key: password
      containers:
        - name: extract-api
          image: "{{ .Values.extract.image }}"
          command:
            - "/var/venv/bin/python"
            - "-m"
            - "uvicorn"
            - "extract.app:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "9500"
            - "--loop"
            - "uvloop"
            - "--http"
            - "httptools"
          env:
            - name: POSTGRES_HOST
              value: "extract-db"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "{{ .Values.extract.database }}"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "extract-db-secret"
                  key: password
            - name: DB_POOL_SIZE
              value: "5"
            - name: DB_MAX_OVERFLOW
              value: "5"
            - name: PORT
              value: "9500"
            - name: LLM_ENDPOINT
              value: http://llm-predictor:8000
            - name: LLM_MODEL
              value: {{ .Values.llm.model | quote }}
            - name: LLM_MAX_MODEL_LEN
              value: "4096"
            - name: LLM_MAX_BATCH_SIZE
              value: "32"
            - name: LOG_LEVEL
              value: "{{ .Values.extract.log_level }}"
          {{- if .Values.llm.apiKey }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: "vllm-instruct-api-key"
                  key: apiKey
          {{- end }}
          ports:
            - containerPort: 9500
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 9500
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 9500
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.extract.resources.requests.cpu | quote }}
              memory: {{ .Values.extract.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.extract.resources.limits.cpu | quote }}
              memory: {{ .Values.extract.resources.limits.memory | quote }}
          volumeMounts:
            - mountPath: /var/cache/extract
              name: cache
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: extract-cache
