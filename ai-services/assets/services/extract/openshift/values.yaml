extract:
  image: icr.io/ai-services-cicd/extract-service:v0.0.20
  log_level: "INFO"
  database: "extract_metadata"
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

postgres:
  image: icr.io/ai-services-cicd/postgres:18-8
  storage: 5Gi
  # @generate:password
  password: ""

mcp:
  enabled: true
  image: icr.io/ai-services-cicd/ai-services-mcp:v0.0.8
  port: 9501
  routeTimeout: 5m
  resources:
    requests:
      cpu: "50m"
      memory: "512Mi"
    limits:
      cpu: "250m"
      memory: "512Mi"
