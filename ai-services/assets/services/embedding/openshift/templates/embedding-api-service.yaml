apiVersion: v1
kind: Service
metadata:
  name: "embedding-api"
  labels:
    ai-services.io/service: {{ .Release.Name }}
    ai-services.io/template: {{ .Chart.Name }}
    ai-services.io/version: {{ default .Chart.AppVersion | quote }}
spec:
  selector:
    ai-services.io/service: {{ .Release.Name }}
    ai-services.io/component: embedding-api
  ports:
    - name: embedding-api
      port: 7000
      targetPort: 7000
      protocol: TCP
