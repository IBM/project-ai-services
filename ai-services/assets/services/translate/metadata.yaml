# Service identification
id: translate
version: "1.0.0"
name: "Translate"
description: "Translates text and long-form documents between languages using an LLM; supports asynchronous document jobs and synchronous text translation with token-aware chunking."
type: service

# Certification and support
certified_by: "IBM"

# Dependencies on other components
dependencies:
  - id: llm

standalone: true

# About field containing detailed service information
about:
  - title: "Service details"
    sections:
      - title: "Version"
        value: "1.0.0"
      - title: "Large language model (LLM)"
        value: "granite-3.3-8b-instruct"
      - title: "Inference backend"
        values:
          - "RedHat AI Inference with Spyre"
          - "AI Inference on CPU"
          - "IBM watsonx.ai on IBM Cloud"

  - title: "Inputs and outputs"
    sections:
      - title: "Inputs"
        values:
          - "Text or document file (.txt / .md) to be translated"
          - "source_language (string): Source language name or 'auto' for automatic detection"
          - "target_language (string): Target language name (e.g. 'German')"
      - title: "Outputs"
        values:
          - "Translated text/file preserving original formatting"

  - title: "Dependencies and integration"
    sections:
      - title: "External dependencies"
        values:
          - "Inferencing endpoint compatible with OpenAI or similar AI APIs (required for LLM-based translation capabilities)"

  - title: "Content and format support"
    sections:
      - title: "Languages"
        values:
          - "English"
          - "German"

  - title: "Expected resource consumption"
    sections:
      - title: "per 5 concurrent users"
        values:
          - title: "Compute"
            value: "7 CPU cores"
          - title: "Memory"
            value: "101.00 GB"
          - title: "Storage"
            value: "60.00 GB"
          - title: "Spyre acceleration cards"
            value: 4

  - title: "Assets"
    sections:
      - title: "Source code"
        ctaLabel: "View source code"
        url: "https://github.com/IBM/project-ai-services"

