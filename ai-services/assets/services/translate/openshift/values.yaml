translate:
  image: icr.io/ai-services-cicd/translate-service:v0.0.15
  log_level: "INFO"
  database: "translate_metadata"
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

postgres:
  image: icr.io/ai-services-cicd/postgres:18-7
  storage: 5Gi
  # @generate:password
  password: ""

mcp:
  enabled: true
  image: icr.io/ai-services-cicd/ai-services-mcp:v0.0.7
  port: 9001
  routeTimeout: 5m
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "128Mi"
