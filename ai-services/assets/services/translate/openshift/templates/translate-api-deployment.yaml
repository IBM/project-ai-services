apiVersion: apps/v1
kind: Deployment
metadata:
  name: "translate-api"
  labels:
    ai-services.io/service: {{ .Release.Name }}
    ai-services.io/template: {{ .Values.templateID }}
    ai-services.io/version: {{ default .Chart.AppVersion | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      ai-services.io/service: {{ .Release.Name }}
      ai-services.io/component: translate-api
  template:
    metadata:
      labels:
        ai-services.io/service: {{ .Release.Name }}
        ai-services.io/template: {{ .Values.templateID }}
        ai-services.io/component: translate-api
        ai-services.io/component-type: api
        ai-services.io/version: {{ default .Chart.AppVersion | quote }}
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: translate-db-init
          image: "{{ .Values.translate.image }}"
          command: [ "/var/venv/bin/python", "db/scripts/init_db.py" ]
          env:
            - name: POSTGRES_HOST
              value: "translate-db"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "{{ .Values.translate.database }}"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "translate-db-secret"
                  key: password
      containers:
        - name: translate-api
          image: "{{ .Values.translate.image }}"
          command:
            - "/var/venv/bin/python"
            - "-m"
            - "uvicorn"
            - "translate.app:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "9000"
            - "--loop"
            - "uvloop"
            - "--http"
            - "httptools"
          env:
            - name: POSTGRES_HOST
              value: "translate-db"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "{{ .Values.translate.database }}"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "translate-db-secret"
                  key: password
            - name: DB_POOL_SIZE
              value: "5"
            - name: DB_MAX_OVERFLOW
              value: "5"
            - name: PORT
              value: "9000"
            - name: LLM_ENDPOINT
              value: http://llm-predictor:8000
            - name: LLM_MODEL
              value: {{ .Values.llm.model | quote }}
            - name: LLM_MAX_MODEL_LEN
              value: "4096"
            - name: LLM_MAX_BATCH_SIZE
              value: "32"
            - name: LOG_LEVEL
              value: "{{ .Values.translate.log_level }}"
          {{- if .Values.llm.apiKey }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: "vllm-instruct-api-key"
                  key: apiKey
          {{- end }}
          ports:
            - containerPort: 9000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.translate.resources.requests.cpu | quote }}
              memory: {{ .Values.translate.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.translate.resources.limits.cpu | quote }}
              memory: {{ .Values.translate.resources.limits.memory | quote }}
