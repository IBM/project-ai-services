apiVersion: apps/v1
kind: Deployment
metadata:
  name: "similarity-api"
  labels:
    ai-services.io/service: {{ .Release.Name }}
    ai-services.io/template: {{ .Values.templateID }}
    ai-services.io/version: {{ default .Chart.AppVersion | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      ai-services.io/service: {{ .Release.Name }}
      ai-services.io/component: similarity-api
  template:
    metadata:
      labels:
        ai-services.io/service: {{ .Release.Name }}
        ai-services.io/template: {{ .Values.templateID }}
        ai-services.io/component: similarity-api
        ai-services.io/component-type: api
        ai-services.io/version: {{ default .Chart.AppVersion | quote }}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.authCatalogHostAliases }}
      hostAliases:
      {{- range .Values.authCatalogHostAliases }}
      - ip: "{{ or .IP .ip }}"
        hostnames:
        {{- range or .Hostnames .hostnames }}
          - "{{ . }}"
        {{- end }}
      {{- end }}
      {{- end }}
      containers:
        - name: similarity-api
          image: "{{ .Values.similarity.image }}"
          command:
            - "/var/venv/bin/python"
            - "-m"
            - "uvicorn"
            - "app:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "7000"
            - "--loop"
            - "uvloop"
            - "--http"
            - "httptools"
          env:
            - name: PORT
              value: "7000"
            - name: EMB_ENDPOINT
              value: http://embedding-predictor:8000
            - name: EMB_MODEL
              value: {{ .Values.embedding.model | quote }}
            - name: EMB_MAX_MODEL_LEN
              value: {{ .Values.embedding.maxModelLen | quote }}
            - name: RERANKER_ENDPOINT
              value: http://reranker-predictor:8000
            - name: RERANKER_MODEL
              value: {{ .Values.reranker.model | quote }}
            - name: OPENSEARCH_HOST
              value: "opensearch"
            - name: OPENSEARCH_PORT
              value: "9200"
            - name: OPENSEARCH_DB_PREFIX
              value: "RAG_DB"
            - name: OPENSEARCH_INDEX_NAME
              value: "RAG_INDEX"
            - name: OPENSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: "opensearch-credentials"
                  key: username
            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "opensearch-credentials"
                  key: password
            - name: LOG_LEVEL
              value: "{{ .Values.similarity.log_level }}"
            # AUTH_JWKS_URL and AUTH_JWKS_PLAINTEXT_HOSTS come from the shared catalog-auth secret.
            - name: AUTH_AUDIENCE
              value: "{{ .Values.authAudience }}"
            {{- if .Values.authCatalogCaBundleSecret }}
            - name: AUTH_CATALOG_CA_BUNDLE
              value: "/etc/ssl/certs/catalog-ca-bundle.crt"
            {{- end }}
          envFrom:
            - secretRef:
                name: "catalog-auth"
          ports:
            - containerPort: 7000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 7000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 7000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.similarity.resources.requests.cpu | quote }}
              memory: {{ .Values.similarity.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.similarity.resources.limits.cpu | quote }}
              memory: {{ .Values.similarity.resources.limits.memory | quote }}
          {{- if .Values.authCatalogCaBundleSecret }}
          volumeMounts:
            - mountPath: /etc/ssl/certs/catalog-ca-bundle.crt
              subPath: ca-bundle.crt
              name: ca-bundle
              readOnly: true
          {{- end }}
        {{- if .Values.mcp.enabled }}
        # No readinessProbe: a pod is only Ready when every container is, so a
        # failing sidecar would pull similarity-api out of the Service endpoints
        - name: mcp-sidecar
          image: "{{ .Values.mcp.image }}"
          args:
            - "--description"
            - "http://localhost:7000/openapi.json"
            - "--endpoint"
            - "http://localhost:7000"
            - "--tag"
            - "mcp"
            - "--port"
            - {{ .Values.mcp.port | quote }}
            - "--auth-passthrough"
            - "--http"
          ports:
            - containerPort: {{ .Values.mcp.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.mcp.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.mcp.resources.requests.cpu | quote }}
              memory: {{ .Values.mcp.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.mcp.resources.limits.cpu | quote }}
              memory: {{ .Values.mcp.resources.limits.memory | quote }}
        {{- end }}
      {{- if .Values.authCatalogCaBundleSecret }}
      volumes:
        - name: ca-bundle
          secret:
            secretName: {{ .Values.authCatalogCaBundleSecret | quote }}
      {{- end }}
