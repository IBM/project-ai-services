apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: cpu-temp
  labels:
    ai-services.io/prerequisite: {{ .Release.Name }}
    ai-services.io/template: {{ .Chart.Name }}
    ai-services.io/version: {{ default .Chart.AppVersion | quote }}
  annotations:
    opendatahub.io/apiProtocol: REST
spec:
  annotations:
    opendatahub.io/kserve-runtime: vllm
    prometheus.io/path: /metrics
    prometheus.io/port: "8000"
  containers:
  - args:
    - --port=8000
    - --model=/mnt/models
    - --gpu-memory-utilization=0.3
    command:
    - python
    - -m
    - vllm.entrypoints.openai.api_server
    env:
    - name: HF_HOME
      value: /tmp/hf_home
    image: icr.io/ppc64le-oss/vllm-ppc64le:0.28.0
    name: kserve-container
    ports:
    - containerPort: 8000
      protocol: TCP
    volumeMounts:
    - mountPath: /dev/shm
      name: dshm
  volumes:
  - emptyDir:
      medium: Memory
      sizeLimit: 512Mi
    name: dshm
  multiModel: false
  supportedModelFormats:
  - autoSelect: true
    name: vLLM
