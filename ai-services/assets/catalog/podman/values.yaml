ui:
  port: ""
  image: icr.io/ai-services-cicd/catalog-ui:v0.0.53

backend:
  port: ""
  image: icr.io/ai-services-cicd/ai-services:v0.0.237
  runtime: ""
  adminPasswordHash: ""
  # workerGatewayPort: port for the gRPC worker gateway. Always active; default is 9090.
  workerGatewayPort: "9090"
  podman:
    uri: "/run/podman/podman.sock"
    authFileContent: ""

db:
  port: ""
  image: icr.io/ai-services-cicd/postgres:18-4
  user: "postgres"
  database: "ai_services"
  password: ""
  resources:
    requests:
      memory: "512Mi"
    limits:
      memory: "1Gi"

caddy:
  image: icr.io/ai-services-cicd/caddy:v2.11.4-1
  adminPort: ""
  httpsPort: ""
