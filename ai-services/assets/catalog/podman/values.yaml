ui:
  port: ""
  image: icr.io/ai-services-cicd/catalog-ui:v0.0.61

backend:
  port: ""
  image: icr.io/ai-services-cicd/ai-services:v0.0.276
  runtime: ""
  adminPasswordHash: ""
  # @generate:password length=32, special=false
  dbEncryptionKey: ""
  # workerGatewayPort: port for the gRPC worker gateway. Always active; default is 9090.
  workerGatewayPort: "9090"
  podman:
    uri: "/run/podman/podman.sock"
    authFileContent: ""

db:
  port: ""
  image: icr.io/ai-services-cicd/postgres:18-5
  user: "postgres"
  database: "ai_services"
  password: ""
  resources:
    requests:
      memory: "512Mi"
    limits:
      memory: "1Gi"

caddy:
  image: icr.io/ai-services-cicd/caddy:v2.11.4-2
  adminPort: ""
  httpsPort: ""
