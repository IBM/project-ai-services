ui:
  port: ""
  image: icr.io/ai-services-cicd/catalog-ui:v0.0.106

backend:
  port: ""
  image: icr.io/ai-services-cicd/ai-services:v0.0.461
  runtime: ""
  adminPasswordHash: ""
  # @generate:password length=32, special=false
  dbEncryptionKey: ""
  # @generate:password length=32, special=false
  mtlsEncryptionKey: ""
  # workerGatewayPort: port for the gRPC worker gateway. Always active; default is 9191.
  workerGatewayPort: "9191"
  # localWorker: when "true" the catalog-backend self-preregisters as the Local worker on startup.
  localWorker: "true"
  podman:
    uri: "/run/podman/podman.sock"
    authFileContent: ""

db:
  port: ""
  image: icr.io/ai-services-cicd/postgres:18-8
  user: "postgres"
  database: "ai_services"
  password: ""
  resources:
    requests:
      memory: "512Mi"
    limits:
      memory: "1Gi"

caddy:
  image: icr.io/ai-services-cicd/caddy:v2.11.7-3
  adminPort: ""
  httpsPort: ""
  privateIngressPort: "9443"
  # caddyFileContent: Generated from the 'Caddyfile.tmpl' template
  caddyFileContent: ""
  # Populated from the certificate content specified via '--ssl-cert' during catalog configuration
  sslCertContent: ""
  # Populated from the private key content specified via '--ssl-key' during catalog configuration
  sslKeyContent: ""

litellm:
  image: "icr.io/ai-services-cicd/litellm:v1.106.4-1"
  # @generate:password length=32, special=false
  masterKey: ""
  # @generate:password length=64, special=false
  saltKey: ""
  dbConnectionRetries: "20"
  db:
    image: icr.io/ai-services-cicd/postgres:18-6
    database: "litellm"
    user: "postgres"
    # @generate:password length=32, special=false
    password: ""
