ui:
  image: icr.io/ai-services-cicd/catalog-ui:v0.0.65
  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

backend:
  image: icr.io/ai-services-cicd/ai-services:v0.0.311
  runtime: "openshift"
  adminPasswordHash: ""
  # @generate:password length=32, special=false
  dbEncryptionKey: ""
  resources:
    requests:
      memory: "1Gi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

bundles:
  storage: 5Gi

db:
  image: icr.io/ai-services-cicd/postgres:18-5
  user: "postgres"
  database: "ai_services"
  password: ""
  storage: 5Gi
  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"
