ui:
  image: icr.io/ai-services/catalog-ui:v0.0.94
  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

backend:
  image: icr.io/ai-services/ai-services:v0.0.418
  runtime: "openshift"
  adminPasswordHash: ""
  # @generate:password length=32, special=false
  dbEncryptionKey: ""
  # workerGatewayPort: port for the gRPC worker gateway. Always active; default is 9191.
  workerGatewayPort: "9191"
  # localWorker: when "true", the catalog-backend auto-joins a co-located worker pod.
  localWorker: "true"
  # @generate:password length=32, special=false
  mtlsEncryptionKey: ""
  resources:
    requests:
      memory: "1Gi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

bundles:
  storage: 5Gi

db:
  image: icr.io/ai-services/postgres:18-6
  user: "postgres"
  database: "ai_services"
  password: ""
  storage: 5Gi
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
