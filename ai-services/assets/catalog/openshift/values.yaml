# appName prefixes the Caddy resource names (<appName>--caddy), as on Podman. The CLI sets it from
# the app-name constants.
appName: ai-services

ui:
  image: icr.io/ai-services-cicd/catalog-ui:v0.0.130
  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

backend:
  image: icr.io/ai-services-cicd/ai-services:v0.0.524
  runtime: "openshift"
  adminPasswordHash: ""
  # @generate:password length=32, special=false
  dbEncryptionKey: ""
  # workerGatewayPort: port for the gRPC worker gateway. Always active; default is 9191.
  workerGatewayPort: "9191"
  # localWorker: when "true", the catalog-backend auto-joins a co-located worker pod.
  localWorker: "true"
  # @generate:password length=32, special=false
  mtlsEncryptionKey: ""
  resources:
    requests:
      memory: "1Gi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# hostAliases adds /etc/hosts entries to the control-plane Caddy pod, for worker Route hosts the
# cluster cannot resolve. Set it from a values file:
#   hostAliases:
#     - ip: "10.0.0.5"
#       hostnames: ["worker-caddy-ns.apps.lab.example.com"]
hostAliases: []

# Caddy terminates the private mTLS traffic between the control plane and remote workers:
#   - ingress :9443 (mTLS)  remote worker -> passthrough Route -> Caddy -> LiteLLM
#   - egress  :8080 (http)  LiteLLM -> Caddy -> mTLS -> remote worker -> model
# The catalog backend registers the per-model egress routes through the Admin API on :2019.
caddy:
  image: icr.io/ai-services-cicd/caddy:v2.11.8-2
  # storage backs Caddy's config autosave so runtime-registered routes survive a restart.
  storage: 10Mi
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"

bundles:
  storage: 5Gi

db:
  image: icr.io/ai-services-cicd/postgres:18-8
  user: "postgres"
  database: "ai_services"
  password: ""
  storage: 5Gi
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

litellm:
  image: "icr.io/ai-services-cicd/litellm:v1.106.4-1"
  # port: port the LiteLLM proxy listens on. The catalog backend reaches it as
  # http://litellm:<port> through the LITELLM_ENDPOINT env var.
  port: "4000"
  # @generate:password length=32, special=false
  masterKey: ""
  # @generate:password length=64, special=false
  saltKey: ""
  dbConnectionRetries: "20"
  resources:
    requests:
      memory: "2Gi"
      cpu: "250m"
    limits:
      memory: "4Gi"
      cpu: "1000m"
  db:
    image: icr.io/ai-services-cicd/postgres:18-6
    database: "litellm"
    user: "postgres"
    # @generate:password length=32, special=false
    password: ""
    storage: 5Gi
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"
