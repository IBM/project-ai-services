{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace "catalog-mtls-encryption-secret" }}
apiVersion: v1
kind: Secret
metadata:
  name: "catalog-mtls-encryption-secret"
  labels:
    ai-services.io/application: {{ .Release.Name }}
    ai-services.io/template: {{ .Chart.Name }}
    ai-services.io/version: {{ default .Chart.AppVersion | quote }}
    ai-services.io/component: catalog
type: Opaque
stringData:
  mtls-encryption-key: {{ if $existingSecret }}{{ index $existingSecret.data "mtls-encryption-key" | b64dec | quote }}{{ else }}{{ .Values.backend.mtlsEncryptionKey | quote }}{{ end }}
