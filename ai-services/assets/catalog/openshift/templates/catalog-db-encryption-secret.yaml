{{- if not (lookup "v1" "Secret" .Release.Namespace "catalog-db-encryption-secret") }}
apiVersion: v1
kind: Secret
metadata:
  name: "catalog-db-encryption-secret"
  labels:
    ai-services.io/application: {{ .Release.Name }}
    ai-services.io/template: {{ .Chart.Name }}
    ai-services.io/version: {{ default .Chart.AppVersion | quote }}
    ai-services.io/component: catalog
type: Opaque
stringData:
  db-encryption-key: {{ .Values.backend.dbEncryptionKey | quote }}
{{- end }}  
