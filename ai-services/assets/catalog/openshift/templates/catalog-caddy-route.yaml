apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.appName }}--caddy
  labels:
    ai-services.io/application: {{ .Release.Name }}
    ai-services.io/template: {{ .Chart.Name }}
    ai-services.io/version: {{ default .Chart.AppVersion | quote }}
  annotations:
    # Model and LiteLLM responses can stream for a long time.
    haproxy.router.openshift.io/timeout: 1h
spec:
  port:
    targetPort: ingress
  to:
    kind: Service
    name: {{ .Values.appName }}--caddy
  tls:
    # passthrough keeps mTLS end to end: the router forwards the encrypted stream untouched, so
    # Caddy sees the worker's client certificate. The host is assigned by the cluster; the catalog
    # backend adds it to the gateway server certificate SANs (see serverCertDNSNames).
    termination: passthrough
    insecureEdgeTerminationPolicy: None
