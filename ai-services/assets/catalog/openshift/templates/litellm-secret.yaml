{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace "litellm-secret" }}
apiVersion: v1
kind: Secret
metadata:
  name: "litellm-secret"
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    ai-services.io/application: {{ .Release.Name }}
    ai-services.io/template: {{ .Chart.Name }}
    ai-services.io/version: {{ default .Chart.AppVersion | quote }}
    ai-services.io/component: litellm
type: Opaque
stringData:
  master-key: {{ if $existingSecret }}{{ index $existingSecret.data "master-key" | b64dec | quote }}{{ else }}{{ .Values.litellm.masterKey | quote }}{{ end }}
  salt-key: {{ if $existingSecret }}{{ index $existingSecret.data "salt-key" | b64dec | quote }}{{ else }}{{ .Values.litellm.saltKey | quote }}{{ end }}
