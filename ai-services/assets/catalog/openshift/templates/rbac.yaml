apiVersion: v1
kind: ServiceAccount
metadata:
  # Namespace-qualified so each catalog deployment on the same cluster owns its own SA.
  name: {{ .Release.Namespace }}-catalog-sa
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  # Namespace-qualified so that multiple catalog deployments on the same cluster
  # (e.g. ai-services-dev, ai-services-staging) each own their own ClusterRole
  # and do not conflict with each other's Helm release-namespace annotation.
  name: {{ .Release.Namespace }}-catalog-reader
rules:
  # Required by GatewayRouteHost to look up the catalog-worker-gateway Route host
  # in order to embed the correct DNS SAN in the server certificate and bootstrap token.
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  # Namespace-qualified to match the ClusterRole above.
  name: {{ .Release.Namespace }}-catalog-reader-binding
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Namespace }}-catalog-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Namespace }}-catalog-reader
  apiGroup: rbac.authorization.k8s.io
