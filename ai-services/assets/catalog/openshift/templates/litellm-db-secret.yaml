{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace "litellm-db-secret" }}
apiVersion: v1
kind: Secret
metadata:
  name: "litellm-db-secret"
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    ai-services.io/application: {{ .Release.Name }}
    ai-services.io/template: {{ .Chart.Name }}
    ai-services.io/version: {{ default .Chart.AppVersion | quote }}
    ai-services.io/component: litellm-db
type: Opaque
stringData:
  db-password: {{ if $existingSecret }}{{ index $existingSecret.data "db-password" | b64dec | quote }}{{ else }}{{ .Values.litellm.db.password | quote }}{{ end }}
