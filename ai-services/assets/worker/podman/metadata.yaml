name: ai-services-worker
version: 0.0.1
description: "Worker node services for Project AI-Services"
podTemplateExecutions:
  - [auth-secret.yaml.tmpl, worker-mtls-encryption-secret.yaml.tmpl, caddy-cert-secret.yaml.tmpl]
  - [worker.yaml.tmpl]
  # Caddy starts after the worker has joined: its private ingress (:9443) reads the
  # certificate the worker receives at registration.
  - [caddy.yaml.tmpl]
