{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace "worker-mtls-encryption-secret" }}
apiVersion: v1
kind: Secret
metadata:
  name: "worker-mtls-encryption-secret"
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    ai-services.io/application: {{ .Release.Name }}
    ai-services.io/template: {{ .Chart.Name }}
    ai-services.io/version: {{ default .Chart.AppVersion | quote }}
    ai-services.io/component: worker
type: Opaque
stringData:
  mtls-encryption-key: {{ if $existingSecret }}{{ index $existingSecret.data "mtls-encryption-key" | b64dec | quote }}{{ else }}{{ .Values.worker.mtlsEncryptionKey | quote }}{{ end }}
