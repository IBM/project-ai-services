- id: BAAI/bge-reranker-v2-m3
  name: BGE Reranker v2 M3
  default: true
  title: bge-reranker-v2-m3
  description: |-
    A multilingual, cross‑encoder–based reranker model used to improve retrieval quality by scoring and ranking candidate documents. It enhances search relevance by providing high‑accuracy reranking on top of initial vector retrieval.

    **Model strengths**: Reliable instruction-following, contextual reasoning, and accurate response generation across a wide range of natural language tasks from summarization and question answering to prompt-driven workflows.

    **Supported Languages**: English (primary), Spanish, French, German, Portuguese, Italian, Japanese, Korean, Chinese, Arabic, and 90+ more.
