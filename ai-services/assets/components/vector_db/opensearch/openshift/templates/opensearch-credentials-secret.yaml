apiVersion: v1
kind: Secret
metadata:
  name: "opensearch-credentials"
  labels:
    ai-services.io/component: {{ .Release.Name }}
    ai-services.io/template: {{ .Values.templateID }}
    ai-services.io/version: {{ default .Chart.AppVersion | quote }}
type: Opaque
stringData:
  username: {{ .Values.auth.username | default "admin" | quote }}
  password: {{ .Values.auth.password | default "AiServices@12345" | quote }}
