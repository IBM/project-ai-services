- id: ibm-granite/granite-4.1-8b
  name: Granite 4.1 8B
  default: true
  title: granite-4.1-8b
  description: |-
    An 8b-parameter instruction-tuned LLM used for natural language understanding and generation tasks. In this project, it powers tasks such as prompt-based reasoning, summarization, answer generation, and other LLM-driven functionalities.

    **Model strengths**: Reliable instruction-following, natural conversation, strong reasoning, and enterprise-grade accuracy.

    **Supported Languages**: English (primary), Spanish, French, German, Portuguese, Italian, Japanese, Korean, Chinese, Arabic, and 100+ more.
  license: Apache-2.0
  certified_by: IBM
  about:
    - title: "Model strengths"
      sections:
        - title: "Strengths"
          values:
            - Reliable instruction-following
            - Natural conversation and dialogue
            - Strong reasoning and tool calling
            - Enterprise-grade accuracy
    - title: "Supported languages"
      sections:
        - title: "Languages"
          values:
            - English
            - Spanish
            - French
            - German
            - Portuguese
            - Italian
            - Japanese
            - Korean
            - Chinese
            - Arabic
  default_profile: standard
  profiles:
    - standard
    - dual-gpu

