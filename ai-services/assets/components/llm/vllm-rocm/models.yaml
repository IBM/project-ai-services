- id: openai/gpt-oss-120b
  name: gpt-oss 120B
  default: false
  title: gpt-oss-120b
  description: |-
    An open-weight 120b-parameter mixture-of-experts reasoning model from OpenAI, designed for powerful reasoning, agentic tasks and function calling. In this project, it powers tasks such as prompt-based reasoning, summarization, answer generation, and other LLM-driven functionalities.

    **Model strengths**: Strong reasoning with configurable reasoning effort, native tool use and function calling, and long context support.
  license: Apache-2.0
  certified_by: OpenAI
  about:
    - title: "Model strengths"
      sections:
        - title: "Strengths"
          values:
            - Strong reasoning with configurable reasoning effort
            - Native function calling and tool use
            - Agentic workflows
            - Long context support
  default_profile: standard
  profiles:
    - standard
    - dual-gpu

