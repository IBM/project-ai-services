apiVersion: v1
kind: Service
metadata:
  name: "llm-predictor"
  labels:
    ai-services.io/component: {{ .Release.Name }}
    ai-services.io/template: {{ .Values.templateID }}
    ai-services.io/version: {{ default .Chart.AppVersion | quote }}
spec:
  selector:
    ai-services.io/component: {{ .Release.Name }}
    ai-services.io/name: llm
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
