apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: llm
  annotations:
    security.opendatahub.io/enable-auth: "false"
    serving.kserve.io/deploymentMode: RawDeployment
  labels:
    networking.kserve.io/visibility: cluster-local
    ai-services.io/component: {{ .Release.Name }}
    ai-services.io/template: {{ .Values.templateID }}
    ai-services.io/version: {{ default .Chart.AppVersion | quote }}
spec:
  predictor:
    automountServiceAccountToken: false
    deploymentStrategy:
      type: Recreate
    maxReplicas: 1
    minReplicas: 1
    model:
      modelFormat:
        name: vLLM
      args:
        - --served-model-name={{ .Values.model }}
        - --max-model-len=32768
        - --max-num-seqs=32
      env:
        - name: VLLM_CPU_OMP_THREADS_BIND
          value: "auto"
        - name: VLLM_CPU_KVCACHE_SPACE
          value: "32"
      {{- if .Values.apiKey }}
        - name: VLLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: vllm-instruct-api-key
              key: apiKey
      {{- end }}
      resources:
        requests:
          cpu: {{ .Values.resources.requests.cpu | quote }}
          memory: {{ .Values.resources.requests.memory | quote }}
        limits:
          cpu: {{ .Values.resources.limits.cpu | quote }}
          memory: {{ .Values.resources.limits.memory | quote }}
      runtime: cpu-temp
      storageUri: {{ .Values.storageUri }}
