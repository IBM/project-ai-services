apiVersion: v1
kind: Service
metadata:
  name: "triton"
  labels:
    ai-services.io/component: {{ .Release.Name }}
    ai-services.io/template: {{ .Values.templateID }}
    ai-services.io/version: {{ default .Chart.AppVersion | quote }}
spec:
  type: ClusterIP
  selector:
    ai-services.io/component: {{ .Release.Name }}
    ai-services.io/name: triton
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: metrics
      port: 8002
      targetPort: 8002
      protocol: TCP
