apiVersion: v1
kind: Service
metadata:
  name: "triton"
  labels:
    ai-services.io/service: {{ .Release.Name }}
    ai-services.io/template: {{ .Values.templateID }}
    ai-services.io/version: {{ default .Chart.AppVersion | quote }}
    ai-services.io/component: triton
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: metrics
      port: 8002
      targetPort: 8002
  selector:
    ai-services.io/service: {{ .Release.Name }}
    ai-services.io/component: triton
