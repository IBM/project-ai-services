          schema:
            items:
              $ref: '#/definitions/github_com_project-ai-services_ai-services_internal_pkg_catalog_types.Worker'
            type: array
        "500":
          description: Internal error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List all workers
      tags:
      - Workers
    post:
      consumes:
      - application/json
      description: |-
        Pre-registers a worker by name, creates a pending DB row, and returns a single-use bootstrap token.
        The operator passes this token when starting the worker daemon (`worker join --token <token>`).
      parameters:
      - description: Worker registration request
        in: body
        name: worker
        required: true
        schema:
          $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.createWorkerReq'
      produces:
      - application/json
      responses:
        "201":
          description: Worker registered; token valid for 24 hours
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.createWorkerResp'
        "400":
          description: Invalid payload
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Register a new worker
      tags:
      - Workers
  /workers/{id}:
    delete:
      description: |-
        Permanently removes a worker from the registry and the database.
        If the worker is currently connected its gRPC stream is also cleaned up.
      parameters:
      - description: Worker ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Worker deleted
        "400":
          description: Invalid worker ID
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Worker not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Deregister a worker
      tags:
      - Workers
