basePath: /api/v1
definitions:
  github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.Component:
    properties:
      component_type:
        type: string
      params:
        additionalProperties: {}
        type: object
      provider_id:
        type: string
      version:
        type: string
    required:
    - component_type
    - provider_id
    - version
    type: object
  github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.ConnectDatasourcesRequest:
    properties:
      datasource_ids:
        description: DatasourceIDs is the list of datasource connector UUIDs to connect.
        items:
          type: string
        minItems: 1
        type: array
    required:
    - datasource_ids
    type: object
  github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.ConnectDatasourcesResponse:
    properties:
      errors:
        items:
          $ref: '#/definitions/github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.DatasourceConnectionError'
        type: array
    type: object
  github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.ConnectedApplicationItem:
    properties:
      catalog_id:
        description: CatalogID is the catalog identifier of the owning application
          (e.g. "rag").
        type: string
      display_name:
        description: |-
          DisplayName is the resolved display name of the owning application (e.g. "Digital Assistants").
          Falls back to CatalogID when the catalog entry cannot be loaded.
        type: string
      err_msg:
        description: |-
          ErrMsg is populated when sync state could not be fetched (e.g. service unreachable or
          no endpoint registered). Empty on success.
        type: string
      id:
        description: ID is the UUID of the application that owns this service.
        type: string
      last_sync_at:
        description: LastSyncAt is the ISO-8601 timestamp of the last completed sync,
          or null when unavailable.
        type: string
      name:
        description: Name is the human-readable display name of the owning application.
        type: string
      sync_status:
        description: |-
          SyncStatus is the current sync state sourced from the downstream service pod.
          Set to "unknown" when the pod is unreachable.
        type: string
    type: object
  github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.CreateApplicationRequest:
    properties:
      catalog_id:
        type: string
      name:
        maxLength: 100
        minLength: 3
        type: string
      services:
        items:
          $ref: '#/definitions/github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.Service'
        type: array
      version:
        type: string
      worker_name:
        description: |-
          WorkerName is the name of a connected remote worker to deploy to.
          When empty the application is deployed locally.
        type: string
    required:
    - catalog_id
    - name
    - services
    - version
    type: object
  github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.CreateApplicationResponse:
    properties:
      id:
        type: string
    type: object
  github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.CreateDatasourceRequest:
    properties:
      name:
        description: |-
          Name is the unique human-readable label for this connector.
          Must be 3–100 characters; only letters, digits, hyphens (-), and underscores (_) are
          allowed. Duplicate-name detection is case-insensitive ("My-DB" and "my-db" conflict).
        maxLength: 100
        minLength: 3
        type: string
      params:
        additionalProperties: {}
        description: |-
          Params holds the provider-specific configuration. Sensitive fields (format: "password"
          in the JSON schema) are encrypted at rest; all other fields are stored in plain text.
        type: object
      provider_id:
        description: ProviderID identifies the provider implementation (e.g. "object_storage",
          "file_system").
        type: string
    required:
    - name
    - params
    - provider_id
    type: object
  github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.CreateDatasourceResponse:
    properties:
      id:
        type: string
    type: object
  github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.DatasourceApplicationsResponse:
    properties:
      applications:
        description: |-
          Applications lists every application currently connected to this datasource,
          enriched with live sync state from each downstream service pod.
        items:
          $ref: '#/definitions/github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.ConnectedApplicationItem'
        type: array
      datasource_id:
        description: DatasourceID is the UUID of the queried datasource connector.
        type: string
    type: object
  github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.DatasourceConnectionError:
    properties:
      datasource_id:
        type: string
      error:
        type: string
    type: object
  github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.DatasourceListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.DatasourceResponse'
        type: array
      pagination:
        $ref: '#/definitions/github_com_project-ai-services_ai-services_internal_pkg_catalog_types.PaginationMetadata'
    type: object
  github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.DatasourceProviderInfo:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.DatasourceResponse:
    properties:
      connected_services:
        type: integer
      created_at:
        type: string
      id:
        type: string
      message:
        type: string
      name:
        type: string
      provider:
        $ref: '#/definitions/github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.DatasourceProviderInfo'
      status:
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
  github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.GetApplicationDatasourceResponse:
    properties:
      id:
        description: ID is the UUID of the datasource connector.
        type: string
      message:
        description: Message contains a human-readable description of the current
          status (omitted when empty).
        type: string
      name:
        description: Name is the unique human-readable label for this connector.
        type: string
      provider:
        allOf:
        - $ref: '#/definitions/github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.DatasourceProviderInfo'
        description: Provider contains the provider ID and its resolved display name.
      service_details:
        allOf:
        - $ref: '#/definitions/github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.ServiceSyncDetails'
        description: ServiceDetails contains live sync state fetched from the linked
          service.
      status:
        description: 'Status is the catalog-side connectivity health: "connected"
          or "offline".'
        type: string
    type: object
  github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.GetDatasourceResponse:
    properties:
      applications:
        description: |-
          Applications lists every application currently connected to this datasource,
          enriched with live sync state from each downstream service pod.
        items:
          $ref: '#/definitions/github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.ConnectedApplicationItem'
        type: array
      created_at:
        description: CreatedAt is the creation timestamp.
        type: string
      id:
        description: ID is the UUID of the datasource connector.
        type: string
      message:
        description: Message contains a human-readable description of the current
          status (may be empty).
        type: string
      metadata:
        additionalProperties: {}
        description: |-
          Metadata holds the non-sensitive configuration fields.
          Sensitive fields (e.g. secret_access_key, private_key) are always stripped.
        type: object
      name:
        description: Name is the unique human-readable label.
        type: string
      provider:
        allOf:
        - $ref: '#/definitions/github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.DatasourceProviderInfo'
        description: Provider contains the provider ID and its resolved display name.
      status:
        description: Status is the current connectivity status ("connected" or "offline").
        type: string
      type:
        description: Type is always "datasource".
        type: string
      updated_at:
        description: UpdatedAt is the last-update timestamp.
        type: string
    type: object
  github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.PropagationError:
    properties:
      error:
        description: Error is the human-readable reason the propagation failed.
        type: string
      id:
        description: ID is the UUID of the application whose Digitize service could
          not be updated.
        type: string
      name:
        description: Name is the display name of that application, for UI rendering.
        type: string
    type: object
  github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.Service:
    properties:
      catalog_id:
        type: string
      components:
        items:
          $ref: '#/definitions/github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.Component'
        type: array
      params:
        additionalProperties: {}
        description: Service-level parameters
        type: object
      version:
        type: string
    required:
    - catalog_id
    - components
    - version
    type: object
  github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.ServiceSyncDetails:
    properties:
      err_msg:
        description: |-
          ErrMsg is populated when the connected service was unreachable or returned an error.
          Omitted from the JSON response when empty (i.e. when the service was reachable).
        type: string
      last_sync_at:
        description: LastSyncAt is the ISO-8601 timestamp of the last completed sync,
          or null when unavailable.
        type: string
      last_sync_error:
        description: LastSyncError is the error string from the last failed sync,
          or null on success.
        type: string
      sync_status:
        description: SyncStatus is the current sync state from the service. Set to
          "unknown" when unreachable.
        type: string
      total_files:
        description: TotalFiles is the total number of files known to the connector,
          or null when unavailable.
        type: integer
    type: object
  github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.UpdateDatasourceRequest:
    properties:
      params:
        additionalProperties: {}
        description: |-
          Params holds the credential fields to update. Only fields in the provider's
          schema whose ui:section is "Authentication" may be changed; structural fields
          are filtered out server-side.
          Note: binding:"required" only prevents null/missing — an empty map is rejected in the
          service layer, which also validates that at least one updatable field is present.
        type: object
    required:
    - params
    type: object
  github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.UpdateDatasourceResponse:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: string
      message:
        type: string
      name:
        type: string
      propagation_errors:
        description: |-
