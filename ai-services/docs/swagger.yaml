host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
    url: https://github.com/project-ai-services/ai-services
  description: API server for managing AI Services catalog, applications, and authentication
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: AI Services Catalog API
  version: "1.0"
paths:
  /applications:
    get:
      description: Retrieves a paginated list of all applications for the authenticated
        user with optional filters
      parameters:
      - default: 1
        description: Page number (1-indexed)
        in: query
        name: page
        type: integer
      - default: 20
        description: 'Number of items per page (max: 100)'
        in: query
        name: page_size
        type: integer
      - description: 'Filter by deployment type: ''architectures'' or ''services'''
        in: query
        name: deployment_type
        type: string
      - description: Filter by catalog ID (e.g., 'rag', 'chat', 'digitize', 'summarize')
        in: query
        name: catalog_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_project-ai-services_ai-services_internal_pkg_catalog_types.ApplicationListResponse'
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List applications
      tags:
      - Applications
    post:
      consumes:
      - application/json
      description: Creates a new application (architecture or service) with optional
        custom parameters
      parameters:
      - description: Application creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.CreateApplicationRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Application creation initiated
          schema:
            $ref: '#/definitions/github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.CreateApplicationResponse'
        "400":
          description: Invalid request body or validation errors
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "409":
          description: Application name already exists
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "422":
          description: Parameter validation failed or invalid template
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create new application
      tags:
      - Applications
  /applications/{id}:
    delete:
      description: Initiates async deletion of an application and all its resources.
        Returns 202 immediately.
      parameters:
      - description: Application ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: 'When ''true'', preserves underlying data (volumes of databases/service
          resources). Default: ''false'''
        in: query
        name: keep_data
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_repository.DeleteApplicationResponse'
        "400":
          description: Invalid application ID or keep_data parameter
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "403":
          description: User doesn't own this application
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "404":
          description: Application not found
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "409":
          description: Application is already being deleted
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete application
      tags:
      - Applications
    get:
      description: Retrieves a single application by its unique identifier for the
        authenticated user
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_project-ai-services_ai-services_internal_pkg_catalog_types.Application'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "404":
          description: Application not found
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get application by ID
      tags:
      - Applications
    put:
      consumes:
      - application/json
      description: Updates the display name of an existing application
      parameters:
      - description: Application ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Update request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.UpdateApplicationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_project-ai-services_ai-services_internal_pkg_catalog_types.Application'
        "400":
          description: Invalid request body or name validation failed
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "403":
          description: User doesn't own this application
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "404":
          description: Application not found
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update application
      tags:
      - Applications
  /applications/{id}/datasources:
    put:
      consumes:
      - application/json
      description: Links one or more datasource connectors to each eligible (Digitize)
        service in a running application. Each datasource is processed independently.
        Returns 204 when all succeed; returns 207 with per-datasource errors when
        one or more fail.
      parameters:
      - description: Application ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: List of datasource IDs to connect
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.ConnectDatasourcesRequest'
      produces:
      - application/json
      responses:
        "204":
          description: All datasources connected successfully
        "207":
          description: One or more datasources failed to connect
          schema:
            $ref: '#/definitions/github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.ConnectDatasourcesResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "404":
          description: Application or datasource not found
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "422":
          description: No eligible running service found
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Connect datasources to application
      tags:
      - Datasources
  /applications/{id}/datasources/{datasource_id}:
    get:
      description: Returns the catalog identity and live sync state of a datasource
        connected to the given application. Sync fields are sourced from the linked
        service and degrade gracefully to sync_status "unknown" when the service is
        unreachable.
      parameters:
      - description: Application ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Datasource connector ID (UUID)
        in: path
        name: datasource_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Datasource status
          schema:
            $ref: '#/definitions/github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_models.GetApplicationDatasourceResponse'
        "400":
          description: Invalid UUID format
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "404":
          description: Datasource not connected to this application
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get datasource status for an application
      tags:
      - Datasources
  /applications/{id}/ps:
    get:
      description: Retrieves the process status and runtime information for an application
      parameters:
      - description: Application ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_project-ai-services_ai-services_internal_pkg_catalog_types.ApplicationPSResponse'
        "400":
          description: Invalid application ID format
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "404":
          description: Application not found
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get application process status
      tags:
      - Applications
  /applications/{id}/resources:
    get:
      description: Retrieves used and total allocated CPU (in cores) and memory usage
        (in bytes), along with the hardware accelerator cards for an application and
        its services
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_project-ai-services_ai-services_internal_pkg_catalog_types.ApplicationResourcesResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "404":
          description: Application not found
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get application resources
      tags:
      - Applications
  /architectures:
    get:
      description: Retrieves a list of all available architecture templates with summary
        information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_project-ai-services_ai-services_internal_pkg_catalog_types.ArchitectureSummary'
            type: array
        "401":
          description: Unauthorized - Invalid or missing access token
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List available architectures
      tags:
      - Catalog
  /architectures/{id}:
    get:
      description: Retrieves detailed information about a specific architecture template
      parameters:
      - description: Architecture template ID (e.g., 'rag')
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_project-ai-services_ai-services_internal_pkg_catalog_types.Architecture'
        "401":
          description: Unauthorized - Invalid or missing access token
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "404":
          description: Architecture not found
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get architecture details
      tags:
      - Catalog
  /architectures/{id}/deploy-options:
    get:
      description: Retrieves available providers and dependency rules for all services
        and their components within an architecture
      parameters:
      - description: Architecture ID (e.g., 'rag')
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_project-ai-services_ai-services_internal_pkg_catalog_types.DeployOptionsArchitecture'
        "401":
          description: Unauthorized - Invalid or missing access token
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "404":
          description: Architecture not found
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get architecture deploy options
      tags:
      - Catalog
  /architectures/{id}/images:
    get:
      description: |-
        Returns the complete list of container images required to deploy an architecture and all its services and component dependencies.
        The response always includes catalog asset images (the tool image used for housekeeping tasks
        and the catalog infrastructure images for the catalog service itself).
        Both embedded (built-in) and custom bundle architectures are supported.
      parameters:
      - description: Architecture ID (e.g., 'rag')
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of container image references
          schema:
            items:
              type: string
            type: array
        "401":
          description: Unauthorized - Invalid or missing access token
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "404":
          description: Architecture not found
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get architecture images
      tags:
      - Catalog
  /architectures/{id}/models:
    get:
      description: Returns all unique model names referenced in the schemas of all
        component dependencies across every service in the architecture
      parameters:
      - description: Architecture ID (e.g., 'rag')
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of unique model names
          schema:
            items:
              type: string
            type: array
        "401":
          description: Unauthorized - Invalid or missing access token
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "404":
          description: Architecture not found
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get models for an architecture
      tags:
      - Catalog
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return access and refresh tokens
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.loginReq'
      produces:
      - application/json
      responses:
        "200":
          description: Returns access_token, refresh_token, and token_type
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid payload
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid credentials
          schema:
            additionalProperties: true
            type: object
      summary: User login
      tags:
      - Authentication
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Invalidate the current access token
      produces:
      - application/json
      responses:
        "200":
          description: Successfully logged out
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Missing token
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to logout
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: User logout
      tags:
      - Authentication
  /auth/me:
    get:
      description: Get information about the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: Returns user id, username, and name
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get current user info
      tags:
      - Authentication
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Get new access and refresh tokens using a valid refresh token
      parameters:
      - description: Refresh token
        in: body
        name: refresh
        required: true
        schema:
          $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.refreshReq'
      produces:
      - application/json
      responses:
        "200":
          description: Returns new access_token, refresh_token, and token_type
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid payload
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid refresh token
          schema:
            additionalProperties: true
            type: object
      summary: Refresh access token
      tags:
      - Authentication
  /auth/token:
    post:
      description: |-
        **Experimental** — This endpoint is under active development and may change without notice.
        IBM Power Mission Control use this
        endpoint to exchange a pre-existing ManageIQ token for an internal JWT
        without supplying username/password credentials.
      produces:
      - application/json
      responses:
        "200":
          description: Returns access_token, refresh_token, and token_type
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid or expired ManageIQ token
          schema:
            additionalProperties: true
            type: object
        "403":
          description: ManageIQ token does not have required permissions
          schema:
            additionalProperties: true
            type: object
        "404":
          description: ManageIQ resource not found
          schema:
            additionalProperties: true
            type: object
        "503":
          description: ManageIQ unavailable or returned an unexpected server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Exchange a ManageIQ token for a Catalog API JWT
      tags:
      - Authentication
  /catalog/bundles:
    get:
      description: Returns a paginated list of all registered bundles ordered by created_at
        DESC.
      parameters:
      - default: 1
        description: Page number (1-indexed)
        in: query
        name: page
        type: integer
      - default: 20
        description: 'Number of items per page (max: 100)'
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_project-ai-services_ai-services_internal_pkg_catalog_apiserver_services_bundle.BundleListResponse'
        "400":
          description: Invalid pagination parameters
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_pkg_catalog_apiserver_handlers.ErrorResponse'
      security:
      - BearerAuth: []
